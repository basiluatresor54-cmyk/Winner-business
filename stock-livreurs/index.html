    ${kit ? `<div class="warnbox" style="background:var(--vio-soft);color:var(--vio)">Pack : ${p.kit.map(c => c.q + ' × ' + esc(pname(c.pid))).join(' + ')}. Les quantités ci-dessous = nombre de packs possibles.</div>` : ''}
    <div class="kv"><div><b class="num">${kit ? avail(st,'',id) : qAt(st,'',id)}</b><span>Au dépôt</span></div><div><b class="num">${kit ? locs.reduce((s,x)=>s+x[1],0) : inHands(st,id)}</b><span>Chez livreurs</span></div><div><b class="num">${kit ? '—' : totalOf(st,id)}</b><span>Total</span></div></div>
    ${locs.length ? `<div class="card" style="margin-bottom:12px">${locs.map(([l,q]) => `<div class="dl"><span>${esc(l.name)} · ${esc(l.city||'')}</span><span class="num">${q}</span></div>`).join('')}</div>` : ''}
    <div class="card" style="margin-bottom:12px">
      <div class="dl"><span>Prix de vente</span><span class="num">${priceTxt(p)}${p.cur==='FC' ? ' ≈ ' + money(su) : ''}</span></div>
      <div class="dl"><span>Prix d'achat</span><span class="num">${num(p.buy)>0 ? amt(p.buy, p.cur) : (kit && cu ? '≈ ' + money(cu) + ' (produits)' : '<span class="red">à compléter</span>')}</span></div>
      <div class="dl"><span>Commission livreur</span><span class="num">${commVal(p, num(p.comm))}${p.commMode==='pct' ? ' ≈ ' + money(cm) : ''}</span></div>
      ${p.commCity ? Object.entries(p.commCity).map(([c,v]) => `<div class="dl"><span>&nbsp;&nbsp;↳ à ${esc(c)}</span><span class="num">${commVal(p, num(v))}${p.commMode==='pct' ? ' ≈ ' + money(su * num(v) / 100) : ''}</span></div>`).join('') : ''}
      <div class="dl strong"><span>Bénéfice par pièce (après commission)</span><span class="num ${marge<0?'red':'green'}">${money(marge)}</span></div>
      ${p.cat ? `<div class="dl"><span>Catégorie</span><span>${esc(p.cat)}</span></div>` : ''}
      ${p.details ? `<p class="note" style="margin-top:8px;white-space:pre-line">${esc(p.details)}</p>` : ''}
    </div>
    <div class="btns" style="margin-bottom:8px">
      <button class="btn primary" data-a="new:vente" data-pid="${id}">Vendre</button>
      <button class="btn" data-a="new:envoi" data-pid="${id}">Envoyer</button>
      ${kit ? '' : `<button class="btn" data-a="new:entree" data-pid="${id}">Entrée</button><button class="btn" data-a="new:perte" data-pid="${id}">Sortie</button>`}
    </div>
    <button class="btn block" data-a="editprod:${id}">Modifier le produit</button>
    <div class="sec"><h2>Historique</h2></div>
    <div class="list">${hist.length ? hist.map(rowMove).join('') : '<div class="empty">Aucune opération</div>'}</div>`);
}

/* ----- Opérations de stock : entrée, envoi, retour, vente, perte ----- */
function moveForm(type, opt = {}){
  const m = opt.id ? S.moves.find(x => x.id === opt.id) : null;
  if(m) type = m.type;
  if(!S.products.length){ toast("Ajoutez d'abord un produit"); productForm(); return; }
  if((type === 'envoi' || type === 'retour') && !S.livreurs.length){ toast("Ajoutez d'abord un livreur"); livForm(); return; }
  const stEx = stockAt(m ? S.moves.filter(x => x.id !== m.id) : S.moves);
  const pid0 = m?.pid || opt.pid || '';
  const liv0 = m ? (m.liv || m.loc || '') : (opt.liv || '');
  const prods = S.products.filter(p => type === 'entree' || type === 'perte' ? !isKit(p) : true).sort(byName);
  const T = {entree:['Entrée de stock','Ajouter au dépôt'], envoi:['Envoyer du stock à un livreur','Enregistrer l\'envoi'], retour:['Retour de stock au dépôt','Enregistrer le retour'],
             vente:[m ? 'Modifier la vente' : 'Nouvelle vente', m ? 'Enregistrer' : 'Enregistrer la vente'], perte:['Sortie / perte de stock','Enregistrer la sortie']}[type];
  const livOpts = (withDepot, label) => (withDepot ? `<option value="">${label}</option>` : '') + cities().map(c => `<optgroup label="${esc(c)}">${S.livreurs.filter(l => (l.city||'Sans ville') === c).sort(byName).map(l => `<option value="${l.id}" ${l.id===liv0?'selected':''}>${esc(l.name)}</option>`).join('')}</optgroup>`).join('');
  let h = `<form id="mf">`;
  if(type === 'vente' && !m) h += `<details class="card paste" style="margin-bottom:14px" open><summary><b>📋 Coller une commande WhatsApp</b><span class="note"> — remplit le formulaire</span></summary>
      <textarea id="pasteTx" placeholder="Copiez le message du client sur WhatsApp et collez-le ici…"></textarea>
      <div class="btns"><button type="button" class="btn primary sm" id="pasteGo">Remplir automatiquement</button><button type="button" class="btn sm" data-a="tpl">Modèle à envoyer aux clients</button></div>
      <p class="note" id="pasteMsg" style="margin-top:6px"></p></details>`;
  if(type === 'envoi' || type === 'retour') h += field('Livreur *', `<select name="loc" required>${liv0 ? '' : '<option value="">Choisir un livreur…</option>'}${livOpts(false)}</select>`);
  if(type === 'perte') h += field('Où se trouve le produit ?', `<select name="loc">${livOpts(true, 'Au dépôt')}</select>`);
  if(type === 'vente') h += field('Livré par', `<select name="loc">${livOpts(true, 'Vente directe (depuis le dépôt)')}</select>`);
  h += field('Produit *', `<select name="pid" required>${pid0 ? '' : '<option value="">Choisir un produit…</option>'}${prods.map(p => `<option value="${p.id}" ${p.id===pid0?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`);
  h += `<div id="avail"></div><div class="row2">${field('Quantité *', `<input name="qty" type="number" min="1" step="1" required value="${m ? m.qty : 1}">`)}`;
  if(type === 'entree') h += field('Coût unitaire', `<input name="cost" type="number" step="any" min="0" value="${m ? (m.cost ?? '') : ''}">`, '<span id="curl"></span>') + `</div>`;
  else if(type === 'perte') h += field('Motif', `<select name="motif">${MOTIFS.map(x => `<option ${m?.motif===x?'selected':''}>${x}</option>`).join('')}</select>`) + `</div>`;
  else if(type === 'vente') h += field('Prix unitaire', `<input name="price" type="number" step="any" min="0" value="${m ? m.price : ''}">`, '<span id="curl"></span>') + `</div><div class="tot" id="tot"></div>
      ${field('Nom du client', `<input name="client" value="${esc(m?.client)}" placeholder="Ex : Mme Nsimba">`)}
      ${field('Téléphone client (WhatsApp)', `<input name="phone" type="tel" value="${esc(m?.phone)}" placeholder="08… ou +243…">${phoneTools()}`)}
      ${field('Adresse complète de livraison', `<textarea name="addr" placeholder="Commune, quartier, avenue, n°, point de repère…">${esc(m?.addr)}</textarea>`)}
      <div class="row2">${field('Jour de livraison', `<input name="ddate" type="date" value="${m ? (m.ddate || m.date) : today()}">`)}${field('Heure de livraison', `<input name="dtime" type="time" value="${esc(m?.dtime || '')}">`)}</div>
      ${field('Payé en', `<select name="pay">${PAYS.map(x => `<option value="${x}" ${(m?.pay||'')===x?'selected':''}>${x || '— (non précisé)'}</option>`).join('')}</select>`, 'Pour une vente directe : cash, Mobile Money…')}
      <div class="f"><span>Statut</span><div class="seg" id="segS">${Object.entries(STATUS).map(([k,l]) => `<button type="button" data-s="${k}">${l}</button>`).join('')}</div></div>`;
  else h += `<div></div></div>`;
  h += `<div class="row2">${field(type === 'vente' ? 'Date de la commande' : 'Date', `<input name="date" type="date" required value="${m ? m.date : today()}">`)}${field('Note', `<input name="note" value="${esc(m?.note)}" placeholder="${type==='entree'?'Fournisseur…':'Optionnel'}">`)}</div>
    <button class="btn primary block">${T[1]}</button>
    ${m ? `<button type="button" class="btn ghost-bad block" style="margin-top:8px" data-a="delmove:${m.id}">Supprimer cette opération</button>` : ''}</form>`;
  sheet(T[0], h);

  const f = $('#mf'), E = f.elements;
  if(!m && type === 'vente' && opt.client){ E.client.value = opt.client.name || ''; E.phone.value = opt.client.phone || ''; E.addr.value = opt.client.addr || ''; const d = f.querySelector('details.paste'); if(d) d.open = false; }
  let status = m?.status || (liv0 ? 'attente' : 'livre');
  const paintSeg = () => { if($('#segS')) [...$('#segS').children].forEach(b => b.classList.toggle('on', b.dataset.s === status)); };
  paintSeg();
  if($('#segS')) $('#segS').onclick = e => { const b = e.target.closest('button'); if(b){ status = b.dataset.s; paintSeg(); } };
  const srcLoc = () => type === 'entree' ? null : type === 'envoi' ? '' : (E.loc ? E.loc.value : '');
  const upd = () => {
    const p = prod(E.pid.value), loc = srcLoc();
    $('#avail').innerHTML = p && loc !== null ? `<p class="note" style="margin:-4px 0 10px">Disponible ${locName(loc)} : <b>${avail(stEx, loc, p.id)}</b>${isKit(p) ? ' pack(s)' : ' pièce(s)'}</p>` : '';
    if($('#curl') && p) $('#curl').textContent = p.cur === 'FC' ? 'en ' + LC() : 'en dollars ($)';
    if(type === 'vente' && p){
      const q = num(E.qty.value), pr = num(E.price.value), totU = toUSD(q*pr, p.cur), cost = q * (m && m.pid === p.id ? num(m.costU) : unitCostUSD(p));
      const comm = q * commUFor(p, liv(E.loc.value), toUSD(pr, p.cur));
      $('#tot').innerHTML = `<span>Total client</span><b class="num">${amt(q*pr, p.cur)}</b><small>${p.cur==='FC' ? '≈ ' + money(totU) + ' · ' : ''}Commission livreur : ${money(comm)} · Bénéfice : ${money(totU - cost - comm)}${E.loc.value && feeTxt() ? ' · + frais livraison ' + feeTxt() + ' (pour le livreur)' : ''}</small>`;
    }
  };
  E.pid.onchange = () => { const p = prod(E.pid.value); if(p){ if(E.price) E.price.value = p.sell || ''; if(E.cost) E.cost.value = num(p.buy) || ''; } upd(); };
  if(E.loc) E.loc.onchange = () => { if(type === 'vente' && !m){ status = E.loc.value ? 'attente' : 'livre'; paintSeg(); } upd(); };
  E.qty.oninput = upd; if(E.price) E.price.oninput = upd;
  if(!m && pid0) E.pid.onchange(); else upd();
  let extras = [];
  if($('#pasteGo')) $('#pasteGo').onclick = () => {
    const txt = $('#pasteTx').value.trim(); if(!txt){ toast('Collez d\'abord le message du client'); return; }
    const o = parseOrder(txt), got = [], miss = [];
    const set = (n, v, lab) => { if(v){ E[n].value = v; got.push(lab); } else miss.push(lab); };
    if(o.pid){ E.pid.value = o.pid; E.pid.onchange(); got.push('produit'); } else miss.push('produit');
    if(o.qty) E.qty.value = o.qty;
    set('client', o.client, 'nom'); set('phone', o.phone, 'téléphone'); set('addr', o.addr, 'adresse');
    if(o.ddate) E.ddate.value = o.ddate;
    set('dtime', o.dtime, 'heure');
    if(o.liv && E.loc){ E.loc.value = o.liv; E.loc.onchange(); got.push('livreur (' + o.city + ')'); }
    if(o.price && E.price){ E.price.value = o.price; got.push('prix'); }
    if(o.when && (!o.dtime || o.slot)) E.note.value = (E.note.value ? E.note.value + ' · ' : '') + 'Livraison : ' + o.when;
    upd();
    extras = o.items && o.items.length > 1 ? o.items.slice(1) : [];
    $('#pasteMsg').innerHTML = (extras.length ? `<b>🛒 Commande de ${o.items.length} produits :</b> le 1er est rempli ci-dessous, ${extras.map(x => esc(pname(x.pid)) + ' × ' + x.qty).join(', ')} ${extras.length > 1 ? 'seront ajoutés' : 'sera ajouté'} automatiquement à l'enregistrement.<br>` : '') + (got.length ? '✅ Rempli : ' + got.join(', ') + '. ' : '') + (miss.length ? '<span class="red">À compléter : ' + miss.join(', ') + '.</span>' : '') + ' Vérifiez avant d\'enregistrer.';
  };

  f.onsubmit = e => {
    e.preventDefault();
    const p = prod(E.pid.value); if(!p){ toast('Choisissez un produit'); return; }
    const qty = Math.round(num(E.qty.value)); if(qty < 1){ toast('Quantité invalide'); return; }
    const rec = Object.assign({}, m || {id:uid(), ts:Date.now(), type});
    rec.pid = p.id; rec.qty = qty; rec.date = E.date.value || today(); rec.note = E.note.value.trim();
    if(type === 'envoi' || type === 'retour'){ rec.liv = E.loc.value; if(!rec.liv){ toast('Choisissez un livreur'); return; } }
    if(type === 'entree'){ rec.cost = num(E.cost.value); }
    if(type === 'perte'){ rec.loc = E.loc.value; rec.motif = E.motif.value; if(!m || m.pid !== p.id) rec.costU = unitCostUSD(p); }
    if(type === 'vente'){
      rec.liv = E.loc.value; rec.price = num(E.price.value); rec.cur = p.cur;
      if(!m || m.pid !== p.id) rec.costU = unitCostUSD(p);
      if(!m || m.pid !== p.id || m.liv !== rec.liv || m.price !== rec.price) rec.commU = commUFor(p, liv(rec.liv), toUSD(rec.price, p.cur, m && m.cur === p.cur ? m.rate : rate()));
      if(!m || m.pid !== p.id || m.cur !== p.cur) rec.rate = rate();
      rec.client = E.client.value.trim(); rec.phone = E.phone.value.trim(); rec.addr = E.addr.value.trim(); rec.status = status;
      rec.ddate = E.ddate.value || rec.date; rec.dtime = E.dtime.value; rec.pay = E.pay ? E.pay.value : (rec.pay || '');
    }
    let next = m ? S.moves.map(x => x.id === m.id ? rec : x) : S.moves.concat([rec]);
    const more = type === 'vente' && !m ? extras.filter(x => prod(x.pid)).map((x, i) => { const P = prod(x.pid);
      return Object.assign({}, rec, {id:uid(), ts:rec.ts + i + 1, pid:P.id, qty:x.qty, price:x.price, cur:P.cur, rate:rate(), costU:unitCostUSD(P), commU:commUFor(P, liv(rec.liv), toUSD(x.price, P.cur))}); }) : [];
    next = next.concat(more);
    const err = checkStock(next, [p.id].concat(m ? [m.pid] : []).concat(more.map(x => x.pid)));
    if(err){ toast(err); return; }
    S.moves = next;
    if(type === 'entree' && !m && rec.cost > 0) p.buy = rec.cost;
    S.settings.setup = true; save();
    toast(m ? 'Modification enregistrée' : more.length ? `${more.length + 1} ventes enregistrées (une par produit)` : {entree:'Entrée ajoutée au dépôt', envoi:'Stock envoyé au livreur', retour:'Retour enregistré', vente:'Vente enregistrée', perte:'Sortie enregistrée'}[type]);
    if(type === 'vente' && !m){ if(window.onSaleCreated) try{ onSaleCreated(rec); }catch(_){} saleTab = status; render(); saleSheet(rec.id, true); }
    else if((type === 'envoi' || type === 'retour') && opt.liv){ render(); livSheet(opt.liv); }
    else { closeSheet(); render(); }
  };
}

/* ----- Argent : versement, paiement commission, dépense ----- */
function moneyForm(type, opt = {}){
  const m = opt.id ? S.moves.find(x => x.id === opt.id) : null;
  if(m) type = m.type;
  if((type === 'versement' || type === 'paiecomm') && !S.livreurs.length){ toast("Ajoutez d'abord un livreur"); livForm(); return; }
  const liv0 = m?.liv || opt.liv || '';
  const livOpts = cities().map(c => `<optgroup label="${esc(c)}">${S.livreurs.filter(l => (l.city||'Sans ville') === c).sort(byName).map(l => `<option value="${l.id}" ${l.id===liv0?'selected':''}>${esc(l.name)}</option>`).join('')}</optgroup>`).join('');
  const T = {versement:['Versement d\'un livreur','Enregistrer le versement'], paiecomm:['Payer la commission','Enregistrer le paiement'], depense:['Dépense','Enregistrer la dépense']}[type];
  let h = `<form id="nf">`;
  if(type === 'depense') h += field('Catégorie', `<select name="cat">${DEPCATS.map(c => `<option ${(m ? m.cat : opt.cat)===c?'selected':''}>${c}</option>`).join('')}</select>`);
  if(type === 'depense') h += field('Concerne un livreur ? (optionnel)', `<select name="liv"><option value="">Non</option>${livOpts}</select>`);
  else h += field('Livreur *', `<select name="liv" required>${liv0 ? '' : '<option value="">Choisir un livreur…</option>'}${livOpts}</select>`);
  h += `<div id="due"></div><div class="row2">${field('Montant *', `<input name="amount" type="number" step="any" min="0" required value="${m ? m.amount : ''}">`)}
    ${type === 'paiecomm' ? field('Devise', `<select name="cur" disabled><option>$</option></select>`) : field('Devise', `<select name="cur"><option value="$" ${m?.cur!=='FC'?'selected':''}>$</option><option value="FC" ${m?.cur==='FC'?'selected':''}>${esc(LC())}</option></select>`)}</div>
    <div class="row2">${field('Date', `<input name="date" type="date" required value="${m ? m.date : today()}">`)}${field('Note', `<input name="note" value="${esc(m?.note)}" placeholder="${type==='versement'?'Ex : M-Pesa, Airtel Money':'Optionnel'}">`)}</div>
    <button class="btn primary block">${T[1]}</button>
    ${m ? `<button type="button" class="btn ghost-bad block" style="margin-top:8px" data-a="delmove:${m.id}">Supprimer</button>` : ''}</form>`;
  sheet(T[0], h);
  const f = $('#nf'), E = f.elements;
  const upd = () => {
    if(type === 'depense' || !E.liv.value){ $('#due').innerHTML = ''; return; }
    const s = livStats(E.liv.value), dueU = type === 'versement' ? s.toRemit + (m ? moneyUSD(m) : 0) : s.toPay + (m ? num(m.amount) : 0);
    $('#due').innerHTML = `<button type="button" class="tot" style="width:100%;text-align:left" id="fill"><span>${type==='versement'?'Reste à verser':'Commission à payer'}</span><b class="num">${money(dueU)}</b><small>${type==='versement' ? '≈ ' + fcOf(dueU) + ' · ' : 'Cette semaine : ' + money(s.week) + ' · '}touchez pour remplir</small></button>`;
    $('#fill').onclick = () => { if(type === 'versement' && E.cur.value === 'FC') E.amount.value = Math.round(dueU * rate()); else E.amount.value = r2(dueU); };
  };
  E.liv.onchange = upd; upd();
  f.onsubmit = e => {
    e.preventDefault();
    const a = num(E.amount.value); if(!(a > 0)){ toast('Montant invalide'); return; }
    const rec = Object.assign({}, m || {id:uid(), ts:Date.now(), type});
    rec.liv = E.liv.value; rec.amount = a; rec.cur = type === 'paiecomm' ? '$' : E.cur.value; rec.date = E.date.value || today(); rec.note = E.note.value.trim();
    if(!m || m.cur !== rec.cur) rec.rate = rate();
    if(type === 'depense') rec.cat = E.cat.value;
    if(type !== 'depense' && !rec.liv){ toast('Choisissez un livreur'); return; }
    S.moves = m ? S.moves.map(x => x.id === m.id ? rec : x) : S.moves.concat([rec]);
    save(); toast(m ? 'Modification enregistrée' : {versement:'Versement enregistré ✅', paiecomm:'Commission payée ✅', depense:'Dépense enregistrée'}[type]);
    if(!m && type === 'versement' && livStats(rec.liv).toRemit <= 0.009) setTimeout(() => cheer('🎉 ' + lname(rec.liv) + ' a tout versé. Compte à zéro !', 120), 300);
    if(opt.liv && !m){ render(); livSheet(opt.liv); } else { closeSheet(); render(); }
  };
}

/* ----- Détail d'une vente ----- */
function saleSheet(id, fresh){
  const m = S.moves.find(x => x.id === id); if(!m) return;
  const L = liv(m.liv), total = amt(m.qty*m.price, m.cur), u = saleUSD(m);
  const rc = receiptClient(m), rl = receiptLivreur(m);
  sheet(fresh ? 'Vente enregistrée ✅' : 'Vente', `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div style="font-weight:700;font-size:16px">${esc(pname(m.pid))} × ${m.qty} · ${total}</div><div class="note">${esc(m.client || 'Client')} · 📅 ${whenTxt(m)}</div></div><span class="pill p-${m.status}">${STATUS[m.status]}</span></div>
    </div>
    <div class="sec" style="margin-top:4px"><h2>Envoyer les reçus par WhatsApp</h2></div>
    <div class="stack" style="margin-bottom:6px">
      ${L ? `<a class="btn wa block" href="${waLink(L.phone, rl)}" target="_blank" rel="noopener">${ico('wa')} 1. Bon de livraison → ${esc(L.name)}${L.phone ? '' : ' (choisir le contact)'}</a>` : ''}
      <a class="btn wa block" href="${waLink(m.phone, rc)}" target="_blank" rel="noopener">${ico('wa')} ${L ? '2. ' : ''}Reçu → ${esc(m.client || 'client')}${m.phone ? '' : ' (choisir le contact)'}</a>
      <button class="btn block" data-a="recimg:${m.id}">🖼️ Reçu en image (plus professionnel)</button>
    </div>
    <details class="card" style="margin:10px 0 12px"><summary class="note"><b>Voir les messages qui seront envoyés</b></summary>
      ${L ? `<p class="note" style="margin-top:8px"><b>Au livreur :</b></p><pre class="msg">${esc(rl)}</pre>` : ''}
      <p class="note" style="margin-top:8px"><b>Au client :</b></p><pre class="msg">${esc(rc)}</pre></details>
    <div class="f"><span>Statut</span><div class="seg">${Object.entries(STATUS).map(([k,l]) => `<button type="button" class="${m.status===k?'on':''}" data-a="status:${k}" data-id="${m.id}">${l}</button>`).join('')}</div></div>
    <div class="card" style="margin-bottom:12px">
      <div class="dl"><span>Total client</span><span class="num">${total}${m.cur === 'FC' ? ' ≈ ' + money(u) : ''}</span></div>
      <div class="dl"><span>Commission livreur</span><span class="num">${m.liv ? money(m.qty*num(m.commU)) : '—'}</span></div>
      <div class="dl"><span>Bénéfice sur cette vente</span><span class="num">${money(u - m.qty*num(m.costU) - (m.liv ? m.qty*num(m.commU) : 0))}</span></div>

function setStatus(id, st, quiet){
  const m = S.moves.find(x => x.id === id); if(!m || m.status === st) return;
  const rec = Object.assign({}, m, {status:st});
  const err = checkStock(S.moves.map(x => x.id === id ? rec : x), [m.pid]);
  if(err){ toast(err); return; }
  m.status = st; save(); render(); if(!quiet) saleSheet(id);
  if(st === 'livre') cheer('Livrée ✅ — commission comptée', 60); else toast(st === 'annule' ? 'Vente annulée — stock remis' : 'Statut : ' + STATUS[st]);
}

/* ---------- Sauvegarde ---------- */
function download(name, text, mime){
  try{
    const url = URL.createObjectURL(new Blob([text], {type:mime}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(e){}
}
function copyText(t){
  try{ navigator.clipboard.writeText(t).then(() => toast('Copié ✅'), () => toast('Sélectionnez le texte et copiez-le')); }
  catch(e){ toast('Sélectionnez le texte et copiez-le'); }
}
const slug = () => (S.settings.shop || 'boutique').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function restoreSheet(){
  sheet('Restaurer une sauvegarde', `<p class="note" style="margin-bottom:12px">Attention : les données actuelles seront remplacées.</p>
    <div class="stack"><label class="btn primary block" style="cursor:pointer">Choisir le fichier de sauvegarde<input type="file" accept=".json,application/json,text/plain" id="rfile" hidden></label>
    <p class="note" style="text-align:center">ou collez le texte de la sauvegarde :</p>
    <textarea class="code" id="rtx" placeholder='{"settings":…}'></textarea>
    <button class="btn block" id="rgo">Restaurer depuis le texte</button></div>`);
  const apply = async txt => {
    let d; try{ d = JSON.parse(txt); }catch(e){ toast('Fichier invalide'); return; }
    if(!d || !Array.isArray(d.products) || !Array.isArray(d.moves)){ toast("Ce n'est pas une sauvegarde valide"); return; }
    if(!await ask(`Remplacer les données actuelles par cette sauvegarde (${d.products.length} produits, ${d.moves.length} opérations) ?`, 'Restaurer')) return;
    S = normalize(d); save(); closeSheet(); view = 'home'; render(); toast('Sauvegarde restaurée ✅');
  };
  $('#rfile').onchange = e => { const file = e.target.files[0]; if(!file) return; const r = new FileReader(); r.onload = () => apply(r.result); r.readAsText(file); };
  $('#rgo').onclick = () => apply($('#rtx').value.trim());
}
function csvSheet(){
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const rows = [['Date commande','Livraison','Heure','Produit','Quantité','Prix unitaire','Devise','Total','Total ($)','Commission livreur ($)','Bénéfice ($)','Livreur','Ville','Client','Téléphone','Adresse','Statut','Note']];
  sortMoves(S.moves.filter(m => m.type === 'vente')).forEach(m => { const u = saleUSD(m), c = m.liv ? m.qty*num(m.commU) : 0;
    rows.push([m.date, m.ddate || m.date, m.dtime || '', pname(m.pid), m.qty, m.price, m.cur, m.qty*m.price, r2(u), r2(c), r2(u - m.qty*num(m.costU) - c), m.liv ? lname(m.liv) : 'Dépôt', m.liv ? liv(m.liv)?.city || '' : '', m.client, m.phone, m.addr, STATUS[m.status], m.note]); });
  const csv = '﻿' + rows.map(r => r.map(q).join(';')).join('\n');
  sheet('Exporter les ventes', `<p class="note" style="margin-bottom:12px">${rows.length-1} ventes. Le fichier s'ouvre dans Excel, Google Sheets ou WPS Office.</p>
    <div class="stack"><button class="btn primary block" id="cdl">Télécharger (CSV)</button><button class="btn block" id="ccp">Copier le tableau</button></div>`);
  $('#cdl').onclick = () => { download(`ventes-${slug()}-${today()}.csv`, csv, 'text/csv;charset=utf-8'); toast('Téléchargement lancé'); };
  $('#ccp').onclick = () => copyText(rows.map(r => r.join('\t')).join('\n'));
}

function buildCatalog(src){
  const ids = {};
  src.products.forEach(([code]) => ids[code] = uid() + code);
  S.products = src.products.map(([code,name,cat,cur,sell,comm,kit]) => ({id:ids[code], name, details:'', cat, cur, sell, buy:0, comm, commMode:'fixe', alert:3, kit: kit ? kit.map(([c,q]) => ({pid:ids[c], q})) : null}));
  S.livreurs = src.livreurs.map(([name,phone,city]) => ({id:uid(), name, phone, city, pay:'produit'}));
  return ids;
}
function loadPreset(){
  S = defaults();

function seedDemo(){
  const src = PRESET || GENERIC;
  S = defaults();
  Object.assign(S.settings, {shop: PRESET ? PRESET.shop + ' (exemple)' : 'Ma Boutique (exemple)', color: PRESET ? PRESET.color : '#0F766E', rate: PRESET ? PRESET.rate : 2300, setup:true});
  buildCatalog(src);
  // prix d'achat fictifs (≈ 40 % du prix de vente)
  S.products.forEach(p => { if(!isKit(p)) p.buy = p.cur === 'FC' ? Math.round(p.sell * .4 / 500) * 500 : r2(p.sell * .4); });
  const t = today(), d = k => addDays(t, -k), simple = S.products.filter(p => !isKit(p)), kits = S.products.filter(isKit), L = S.livreurs;
  let ts = Date.now() - 4e9; const push = o => S.moves.push(Object.assign({id:uid(), ts:ts++, note:''}, o));
  simple.forEach(p => push({type:'entree', pid:p.id, qty:60, cost:p.buy, date:d(24), note:'Achat fournisseur'}));
  L.forEach((l,i) => simple.forEach((p,j) => push({type:'envoi', pid:p.id, qty:8 + ((i+j)%3)*2, liv:l.id, date:d(22 - i)})));
  push({type:'depense', cat:'Expédition colis (vers une ville)', amount:25, cur:'$', rate:S.settings.rate, liv:L[L.length-1].id, date:d(21), note:'Colis Kinshasa → ' + L[L.length-1].city});
  push({type:'depense', cat:'Publicité Facebook', amount:30, cur:'$', rate:S.settings.rate, liv:'', date:d(15), note:'Campagne 7 jours'});
  push({type:'depense', cat:'Transport', amount:20000, cur:'FC', rate:S.settings.rate, liv:'', date:d(6), note:'Taxi moto marchandise'});
  const clients = ['Mme Nsimba','M. Kabeya','Mme Mbuyi','M. Lukusa','Mme Ilunga','M. Tshibangu','Mme Kapinga','M. Mukendi'];
  const addr = ['Gombe','Limete','Ngaliema','Bandal','Lemba','Kintambo','Matete','Masina'];
  let n = 0;
  for(let k = 19; k >= 0; k--){
    const cnt = (k*7) % 3 + 1;
    for(let j = 0; j < cnt; j++){
      const pool = (n % 6 === 5 && kits.length) ? kits : simple;
      const p = pool[(k + j*3 + n) % pool.length], l = L[n % L.length];
      let st = k > 2 ? 'livre' : k === 0 ? 'attente' : (j % 2 ? 'encours' : 'livre');
      if(k === 9 && j === 0) st = 'annule';
      const rec = {type:'vente', pid:p.id, qty:1 + (n % 4 === 0 ? 1 : 0), price:p.sell, cur:p.cur, rate:S.settings.rate, costU:unitCostUSD(p), commU:commUFor(p, l, toUSD(p.sell, p.cur)), liv:l.id, client:clients[n%8], phone:'', addr:addr[(n*3)%8], status:st, date:d(k)};
      if(!checkStock(S.moves.concat([rec]), [p.id])) push(rec);
      n++;
    }
  }
  // versements et commissions déjà payées pour une partie
  L.forEach((l,i) => { const s = livStats(l.id), v = r2(Math.max(0, s.cash * (i===0 ? .7 : 1) - (i===1 ? 10 : 0)));
    if(v > 0) push({type:'versement', liv:l.id, amount:v, cur:'$', rate:S.settings.rate, date:d(1), note:'Mobile Money'});
    if(s.earned > 0 && i !== 2) push({type:'paiecomm', liv:l.id, amount:r2(s.earned * .5), date:d(2), note:'Semaine passée'}); });
  push({type:'perte', pid:simple[1].id, qty:1, loc:'', motif:'Cassé / abîmé', costU:unitCostUSD(simple[1]), date:d(5)});
  save(); closeSheet(); view = 'home'; render(); toast('Exemples chargés — effacez-les dans Réglages quand vous voulez');
}

  if(e.target.name === 'lc' && $('#rateHint')) $('#rateHint').textContent = 'en ' + e.target.value;
});

/* ---------- Formulaires : fonctionnent même dans un aperçu restreint (sans envoi de formulaire) ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('form button:not([type=button])'); if(!b) return;
  const f = b.form; if(!f) return;
  e.preventDefault();
  if(!f.checkValidity()){
    const bad = f.querySelector(':invalid');
    const lab = bad && bad.closest('label') && bad.closest('label').querySelector('span');
    toast(lab ? 'À compléter : ' + lab.textContent.replace('*','').trim() : 'Complétez les champs obligatoires');
    if(bad) bad.focus();
    return;
  }
  f.dispatchEvent(new Event('submit', {cancelable:true, bubbles:true}));
}, true);
// Touche « Entrée » dans un champ : même traitement
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const f = e.target.form; if(!f) return;
  e.preventDefault();
  const b = f.querySelector('button:not([type=button])'); if(b) b.click();
});

/* ---------- Démarrage ---------- */
render();
if(!S.settings.setup && !S.products.length){
  sheet('Bienvenue 👋', `<p class="note" style="margin-bottom:14px">Gérez votre stock, vos livreurs dans chaque ville, leurs commissions, les versements et votre bénéfice réel.</p>
    <div class="stack">
    ${PRESET ? `<button class="btn primary block" data-a="preset">Démarrer avec le catalogue ${esc(PRESET.label)}</button><p class="note" style="text-align:center">${PRESET.products.length} produits, prix et commissions déjà remplis</p>` : ''}
    <button class="btn ${PRESET?'':'primary'} block" data-a="startempty">Créer ma boutique</button>
    <button class="btn block" data-a="demo">Essayer avec des exemples</button></div>`);
}
</script>
</body>
</html>
