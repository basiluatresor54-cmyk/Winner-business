<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock">
<title>Stock & Livreurs</title>
<style>
:root{
  --brand:#0F766E;--brand-ink:#fff;--brand-soft:rgba(15,118,110,.12);
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e7e9ee;
  --ok:#15803d;--ok-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fdf2e1;
  --bad:#b91c1c;--bad-soft:#fdeaea;--info:#1d4ed8;--info-soft:#e8eefc;--vio:#6d28d9;--vio-soft:#f1eafd;
  --r:16px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --field:#fff;--soft:#eef0f3;--soft2:#f0f1f4;--hover:#f7f8fa;--sum:#fafbfc;--msg:#eafbe7;--okbox:#ecfdf5;--okline:#a7f3d0;--money-soft:#e9f7f4;--money:#0f766e;--x:#e7e9ee;--brand-tx:var(--brand);--navbg:rgba(255,255,255,.97);
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0f1115;--card:#1a1d23;--ink:#e8eaed;--muted:#9aa1ac;--line:#2c313a;
  --ok:#4ade80;--ok-soft:rgba(74,222,128,.14);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.14);
  --bad:#f87171;--bad-soft:rgba(248,113,113,.14);--info:#7aa2ff;--info-soft:rgba(122,162,255,.15);--vio:#b79bff;--vio-soft:rgba(183,155,255,.15);
  --shadow:0 0 0 1px rgba(255,255,255,.04);
  --field:#14171c;--soft:#262a31;--soft2:#22262d;--hover:#22262d;--sum:#16191e;--msg:#16291c;--okbox:rgba(74,222,128,.10);--okline:rgba(74,222,128,.35);--money-soft:rgba(45,212,191,.14);--money:#5eead4;--x:#2a2e35;--navbg:rgba(26,29,35,.97);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:calc(12px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.top h1{font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{font-size:12.5px;opacity:.85}
.top .grow{min-width:0;flex:1}

main{max-width:980px;margin:0 auto;padding:16px}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:15px;font-weight:700}
.link{font-size:13px;color:var(--brand-tx);font-weight:650;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--brand-tx);margin-bottom:12px;font-size:14px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0;text-align:left}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:750;margin-top:4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--brand);color:var(--brand-ink)}
.kpi.hero .l,.kpi.hero .s{color:inherit;opacity:.88}
.kpi.hero .v{font-size:28px}
.v.pos{color:var(--ok)}.v.neg{color:var(--bad)}
.kpi.hero .v.neg{color:#fecaca}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.chip b{font-weight:700;margin-left:4px;opacity:.8}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.it:last-child{border-bottom:0}
button.it:active{background:var(--hover)}
.it .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.it .m{flex:1;min-width:0}
.it .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{text-align:right;flex:none}
.it .big{font-size:20px;font-weight:750;line-height:1.1}
.it .sm{font-size:11.5px;color:var(--muted)}
.c-in{background:var(--ok-soft);color:var(--ok)}
.c-out{background:var(--info-soft);color:var(--info)}
.c-loss{background:var(--warn-soft);color:var(--warn)}
.c-send{background:var(--vio-soft);color:var(--vio)}
.c-money{background:var(--money-soft);color:var(--money)}
.c-x{background:var(--soft2);color:var(--muted)}
.c-brand{background:var(--brand-soft);color:var(--brand-tx)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-attente{background:var(--warn-soft);color:var(--warn)}
.p-encours{background:var(--info-soft);color:var(--info)}
.p-livre{background:var(--ok-soft);color:var(--ok)}
.p-annule{background:var(--soft2);color:var(--muted)}
.qty-low{color:var(--warn)}.qty-zero{color:var(--bad)}
.strike{text-decoration:line-through;opacity:.6}
.red{color:var(--bad)}.green{color:var(--ok)}

.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--brand);min-height:2px}
.bars i.z{background:var(--line)}
.bars span{font-size:10px;color:var(--muted)}
.hb{display:flex;align-items:center;gap:10px;padding:8px 0}
.hb .n{width:40%;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{flex:1;height:10px;background:var(--brand-soft);border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--brand);border-radius:6px}
.hb .q{font-size:12.5px;color:var(--muted);width:78px;text-align:right}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:4px 0 12px}
.split i{display:block;height:100%}
.leg{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg:last-child{border-bottom:0}
.leg .dot{width:10px;height:10px;border-radius:3px;flex:none}
.leg .n{flex:1;color:var(--muted)}
.leg .a{font-weight:650}
.leg .p{width:46px;text-align:right;font-size:12px;color:var(--muted)}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tb td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tb tr:last-child td{border-bottom:0}
.tb .rt{text-align:right}
.tbw{overflow-x:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:650;background:var(--soft);color:var(--ink);min-height:46px;text-decoration:none;font-size:14.5px;text-align:center}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:#1fa855;color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost-bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack>*+*{margin-top:10px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;font-weight:650;margin-bottom:5px}
.f small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.f input,.f select,.f textarea,.search{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);min-height:46px;font-size:16px;outline:none}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.search:focus{border-color:var(--brand)}
.f input[type=color]{padding:4px;height:46px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.search{margin-bottom:12px;background:var(--card)}
.tot{background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.tot b{font-size:17px}
.tot small{width:100%;font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:block;text-align:left;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:10px 4px;border-radius:10px;background:var(--soft2);font-size:12.5px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg2{grid-template-columns:1fr 1fr}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.colors button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.colors button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.kv b{display:block;font-size:19px}
.kv span{font-size:11.5px;color:var(--muted)}
.dl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl:last-child{border-bottom:0}
.dl>span:first-child{color:var(--muted)}
.dl>span:last-child{text-align:right;font-weight:650}
.dl.strong>span{color:var(--ink)!important;font-weight:750}
.kitrow{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:8px}
.kitrow select,.kitrow input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);min-height:44px;font-size:15px}
.city{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.menu .it .ic{width:42px;height:42px}

nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav.nav button.on{color:var(--brand-tx)}
nav.nav button.on svg{stroke-width:2.3}
.fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.fab svg{width:28px;height:28px}

.ov{position:fixed;inset:0;z-index:50;background:rgba(15,18,25,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .2s}
.ov.on .sh{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.sh-h h3{font-size:18px;line-height:1.25}
.x{width:36px;height:36px;border-radius:50%;background:var(--x);font-size:22px;line-height:1;color:var(--muted);flex:none}
.sh-b{overflow-y:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(15,18,25,.5);display:grid;place-items:center;padding:24px}
.dlg .card{max-width:380px;width:100%;padding:20px}
.dlg p{margin-bottom:16px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16181d;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);text-align:left;margin-bottom:8px}
.act .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.act b{display:block}
.act small{color:var(--muted);font-size:12.5px}
.paste summary{cursor:pointer;list-style:none;margin-bottom:8px}
.paste summary::-webkit-details-marker{display:none}
.paste textarea{width:100%;min-height:110px;padding:10px 12px;border:1.5px dashed var(--brand);border-radius:11px;background:var(--field);font-size:15px;margin-bottom:8px}
pre.msg{white-space:pre-wrap;font:13px/1.45 -apple-system,Roboto,sans-serif;background:var(--msg);border-radius:10px;padding:10px;margin-top:4px}
details summary{cursor:pointer}
textarea.code{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;border:1.5px solid var(--line);border-radius:11px}

.tb .num{white-space:nowrap}
.phtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.phtools .btn{min-height:34px;padding:6px 10px;font-size:13px}
/* photos produits */
.ic.pic{padding:0;overflow:hidden;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:22px}.ic.pic img{width:100%;height:100%;object-fit:cover}
/* vente rapide / rapport du jour */
.quickbtn{font-size:18px;padding:16px;margin:4px 0 10px}
.daycard{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:10px;gap:8px}
.qty{display:flex;gap:6px;align-items:center}.qty input{text-align:center;min-width:0}
.okbox{background:var(--okbox);border:1px solid var(--okline)}
/* relevé */
.relh .logo{background:var(--brand);color:var(--brand-ink);width:48px;height:48px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.sign div{border-top:1px solid #999;padding-top:6px;font-size:12px;color:var(--muted,#666);text-align:center;margin-top:34px}

/* ===== Design « Verre » (style iPhone) — activé par html.glass ===== */
html.glass{--gl:rgba(255,255,255,.66);--gl2:rgba(255,255,255,.78);--glb:rgba(255,255,255,.7);--gls:0 8px 28px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04)}
html.glass[data-theme=dark]{--gl:rgba(32,35,43,.62);--gl2:rgba(36,40,48,.82);--glb:rgba(255,255,255,.08);--gls:0 10px 30px rgba(0,0,0,.35)}
html.glass body{background:
  radial-gradient(900px 520px at -10% -8%, rgba(var(--brand-rgb),.22), transparent 60%),
  radial-gradient(700px 480px at 110% 18%, rgba(var(--brand-rgb),.12), transparent 60%),
  radial-gradient(800px 600px at 50% 110%, rgba(122,162,255,.10), transparent 60%),
  var(--bg);background-attachment:fixed;min-height:100vh}
html.glass .top{background:rgba(var(--brand-rgb),.82);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 24px rgba(var(--brand-rgb),.18)}
html.glass .top h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
html.glass .logo{border-radius:14px;box-shadow:0 0 0 1.5px rgba(255,255,255,.35) inset}
html.glass .card,html.glass .kpi,html.glass .list,html.glass .chip{background:var(--gl);border:1px solid var(--glb);box-shadow:var(--gls)}
html.glass .card,html.glass .kpi,html.glass .list{border-radius:20px}
html.glass .chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
html.glass .kpi.hero{background:linear-gradient(135deg, var(--brand) 0%, rgba(var(--brand-rgb),.78) 100%);border:1px solid rgba(255,255,255,.22);position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(var(--brand-rgb),.28)}
html.glass .kpi.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 42%);pointer-events:none}
html.glass .kpi .v{font-weight:800;letter-spacing:-.02em}
html.glass .sec h2{font-size:17px;font-weight:800;letter-spacing:-.015em}
html.glass .btn{border-radius:14px}
html.glass .btn:not(.primary):not(.wa):not(.ghost-bad){background:var(--gl2);border:1px solid var(--glb)}
html.glass .btn.primary{box-shadow:0 8px 20px rgba(var(--brand-rgb),.28)}
html.glass .f input,html.glass .f select,html.glass .f textarea,html.glass .search{border-radius:14px;background:var(--gl2)}
html.glass .ov{background:rgba(10,12,18,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
html.glass .sh{background:var(--gl2);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glb);border-radius:28px 28px 0 0}
html.glass .fab{border-radius:22px;box-shadow:0 10px 26px rgba(var(--brand-rgb),.4),0 0 0 1px rgba(255,255,255,.25) inset}
@media (max-width:899px){
  html.glass body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  html.glass nav.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:28px;background:var(--gl2);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glb);box-shadow:0 12px 34px rgba(16,24,40,.16);padding:6px 6px}
  html.glass nav.nav button.on{background:rgba(var(--brand-rgb),.14)}
  html.glass .fab{bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media (min-width:900px){ html.glass nav.nav{background:var(--gl);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border-right:1px solid var(--glb)} }
/* Photo de couverture (accueil) */
.cover{position:relative;border-radius:24px;overflow:hidden;min-height:150px;margin-bottom:14px;background:var(--brand) center/cover no-repeat;box-shadow:0 12px 30px rgba(16,24,40,.16);display:flex;align-items:flex-end}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.62) 100%)}
.cover .cv{position:relative;display:flex;gap:12px;align-items:center;padding:14px 16px;color:#fff;width:100%}
.cover .cv .logo{width:48px;height:48px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}

<script>
/* =================================================================
   Gestion de Stock & Livreurs — application web autonome (1 fichier)
   Produits · Stock (dépôt + livreurs) · Ventes · Livreurs par ville
   Commissions · Versements · Dépenses · Bénéfice final
   Données enregistrées sur l'appareil (localStorage).
   ================================================================= */
const KEY = 'stock_livreurs_vierge_v1';

const PRESET = null; // version vierge à revendre
const GENERIC = {
  products:[['g1','Sac antivol','Accessoires','$',15,2],['g2','Crème visage','Beauté','$',10,2],['g3','Savon naturel','Beauté','FC',15000,1],['g4','Coffret crème + savon','Beauté','$',22,3,[['g2',1],['g3',1]]]],
  livreurs:[['Patrick','','Kinshasa'],['Grâce','','Kinshasa'],['Aimé','','Lubumbashi']]
};

const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  truck:'<path d="M2 6h12v10H2zM14 9h4.5L22 12.5V16h-8"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
  user:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3.5 5.5"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  set:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',

  send:'<path d="M4 12h13M12 6l6 6-6 6"/><path d="M20 5v14"/>',

  cart:'<path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
  coin:'<circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.3c-.5-.8-1.4-1.3-2.5-1.3-1.5 0-2.6.8-2.6 2s1.1 1.7 2.6 2 2.6.8 2.6 2-1.1 2-2.6 2c-1.1 0-2-.5-2.5-1.3M12 6.5v1.5M12 16v1.5"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  wa:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/>',
  chev:'<path d="M9 6l6 6-6 6"/>'
};
const ico = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[n]}</svg>`;
const STATUS = {attente:'À livrer', encours:'En cours', livre:'Livré', annule:'Annulé'};
const MOTIFS = ['Cassé / abîmé','Périmé','Perdu / volé','Écart inventaire','Cadeau / échantillon','Usage interne','Autre'];
const DEPCATS = ['Transport','Expédition colis (vers une ville)','Publicité Facebook','Boutique / loyer','Emballage','Crédit / internet','Salaire / aide','Autre'];
const CITIES = ['Kinshasa','Lubumbashi','Bukavu','Kolwezi','Goma','Kisangani','Matadi','Mbuji-Mayi','Kananga'];
const COLORS = ['#8A3B12','#0F766E','#1D4ED8','#7C3AED','#BE185D','#DC2626','#EA580C','#CA8A04','#15803D','#111827'];
const COUNTRIES = [['RDC','FC','243',2300],['Congo-Brazzaville','XAF','242',570],['Cameroun','XAF','237',570],['Gabon','XAF','241',570],['Tchad','XAF','235',570],['Centrafrique','XAF','236',570],["Côte d'Ivoire",'XOF','225',570],['Sénégal','XOF','221',570],['Mali','XOF','223',570],['Burkina Faso','XOF','226',570],['Bénin','XOF','229',570],['Togo','XOF','228',570],['Niger','XOF','227',570],['Guinée','GNF','224',8650],['Burundi','BIF','257',2950],['Rwanda','RWF','250',1450],['Madagascar','MGA','261',4500],['Guinée équatoriale','XAF','240',570],['Comores','KMF','269',''],['Djibouti','DJF','253',''],['Maroc','MAD','212',''],['Algérie','DZD','213',''],['Tunisie','TND','216',''],['Mauritanie','MRU','222',''],['Haïti','HTG','509',''],['France','EUR','33',''],['Belgique','EUR','32',''],['Suisse','CHF','41',''],['Canada','CAD','1',''],['Autre pays','','','']];
const SPLITC = {cost:'#94a3b8', comm:'#6d28d9', dep:'#ea580c', loss:'#b45309', net:'#15803d'};

/* ---------- Données ---------- */
function defaults(){
  return {settings:{shop:'Ma Boutique', logo:'', color:'#0F766E', country:'RDC', lc:'FC', rate:2300, cc:'243', wa:'', fee:8000, feeCur:'FC', setup:false},
          products:[], livreurs:[], moves:[]};
}
let storageOK = true;
function normalize(d){
  const b = defaults();
  return {settings:Object.assign(b.settings, d.settings||{}), products:d.products||[], livreurs:d.livreurs||[], moves:d.moves||[]};
}
function load(){
  try{ const t = localStorage.getItem(KEY); if(t) return normalize(JSON.parse(t)); }
  catch(e){ storageOK = false; }
  return defaults();
}
let S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; toast("Attention : l'enregistrement a échoué sur cet appareil. Faites une sauvegarde."); }
}

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g,'').replace(',', '.')); return isFinite(n) ? n : 0; };
const r2 = n => { const v = Math.round((n||0)*100)/100; return v === 0 ? 0 : v; };
const fmt = n => r2(n).toLocaleString('fr-FR', {maximumFractionDigits:2});
const money = usd => fmt(usd) + ' $';
const LC = () => S.settings.lc || 'FC'; // monnaie locale (code interne « FC »)
const amt = (a, cur) => fmt(a) + (cur === 'FC' ? ' ' + LC() : ' $');
const rate = () => num(S.settings.rate) || 1;
const toUSD = (a, cur, rt) => cur === 'FC' ? a / (num(rt) || rate()) : a;
const fcOf = usd => fmt(Math.round(usd * rate())) + ' ' + LC();
const iso10 = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const today = () => iso10(new Date());
const addDays = (iso, k) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate()+k); return iso10(d); };
const weekStart = () => { const d = new Date(); return addDays(today(), -((d.getDay()+6)%7)); };
function fmtDate(iso, long){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00'), t = today();
  if(iso === t) return "Aujourd'hui";
  if(iso === addDays(t,-1)) return 'Hier';
  const o = {weekday: long ? 'long' : undefined, day:'numeric', month: long ? 'long' : 'short'};
  if(d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('fr-FR', o);
}
const prod = id => S.products.find(p => p.id === id);
const pname = id => prod(id)?.name || 'Produit supprimé';
const liv = id => S.livreurs.find(l => l.id === id);
const lname = id => id ? (liv(id)?.name || 'Livreur supprimé') : 'Dépôt';
const locName = loc => loc ? 'chez ' + lname(loc) : 'au dépôt';
const byName = (a,b) => a.name.localeCompare(b.name, 'fr');
const isKit = p => !!(p && p.kit && p.kit.length);
const sortMoves = arr => arr.sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.ts||0) - (a.ts||0));
const pic = (p, cls) => p && p.photo ? `<div class="ic pic"><img src="${p.photo}" alt=""></div>` : `<div class="ic ${cls||'c-brand'}">${esc(initials(p ? p.name : '?'))}</div>`;
const initials = s => (s||'?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
const priceTxt = p => num(p.old) > num(p.sell) ? `${amt(p.sell||0, p.cur)} <s class="note">${amt(p.old, p.cur)}</s> 🏷️` : amt(p.sell||0, p.cur);
function hexRgb(h){ h = (h||'#0F766E').replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function phoneNorm(p){
  let d = String(p||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('00')) d = d.slice(2);
  else if(d.startsWith('0')) d = (S.settings.cc || '') + d.slice(1);
  return d;
}
const waLink = (phone, text) => 'https://wa.me/' + phoneNorm(phone) + '?text=' + encodeURIComponent(text);
const cities = () => [...new Set(S.livreurs.map(l => l.city || 'Sans ville'))].sort((a,b) => a.localeCompare(b,'fr'));
const feeTxt = () => num(S.settings.fee) ? amt(num(S.settings.fee), S.settings.feeCur) : '';

/* ---------- Calculs : stock ---------- */
// Un pack (kit) se décompose en ses produits ; le stock est tenu sur les produits simples.
function lines(pid, qty){ const p = prod(pid); return isKit(p) ? p.kit.map(c => [c.pid, c.q*qty]) : [[pid, qty]]; }
const isOutSale = m => m.type === 'vente' && m.status !== 'annule';
function stockAt(moves = S.moves){
  const st = {};
  const add = (loc, pid, q) => { const L = st[loc] = st[loc] || {}; L[pid] = (L[pid]||0) + q; };
  for(const m of moves){
    if(!m.pid) continue;
    for(const [pid, q] of lines(m.pid, m.qty)){
      if(m.type === 'entree') add('', pid, q);
      else if(m.type === 'envoi'){ add('', pid, -q); add(m.liv, pid, q); }
      else if(m.type === 'retour'){ add(m.liv, pid, -q); add('', pid, q); }
      else if(isOutSale(m)) add(m.liv||'', pid, -q);
      else if(m.type === 'perte') add(m.loc||'', pid, -q);
      else if(m.type === 'ajust') add(m.loc||'', pid, q);
    }
  }
  return st;
}
const qAt = (st, loc, pid) => (st[loc] && st[loc][pid]) || 0;
function avail(st, loc, pid){ // quantité disponible (packs : nombre de packs possibles)
  const p = prod(pid);
  if(isKit(p)) return Math.max(0, Math.min(...p.kit.map(c => Math.floor(qAt(st, loc, c.pid) / c.q))));
  return qAt(st, loc, pid);
}
function totalOf(st, pid){ let t = 0; for(const loc in st) t += st[loc][pid]||0; return t; }
function inHands(st, pid){ let t = 0; for(const loc in st) if(loc) t += st[loc][pid]||0; return t; }
// Vérifie qu'aucun stock ne devient négatif après une modification
function checkStock(newMoves, pids){
  const st = stockAt(newMoves);
  const set = new Set(); pids.forEach(id => lines(id, 1).forEach(([p]) => set.add(p)));
  for(const loc in st) for(const pid of set) if((st[loc][pid]||0) < 0)
    return `Stock insuffisant : ${pname(pid)} ${locName(loc)} (il manque ${-st[loc][pid]})`;
  return '';
}

/* ---------- Calculs : argent ---------- */
const saleUSD = m => toUSD(m.qty * m.price, m.cur, m.rate);
const moneyUSD = m => toUSD(m.amount, m.cur, m.rate);
function unitCostUSD(p){
  if(!p) return 0;
  if(num(p.buy) > 0) return toUSD(num(p.buy), p.cur);
  if(isKit(p)) return p.kit.reduce((s,c) => s + unitCostUSD(prod(c.pid)) * c.q, 0);
  return 0;
}
// Commission d'un livreur pour 1 pièce : selon le produit (montant fixe ou %), ou % propre au livreur, ou 0 si salarié
function commUFor(p, l, unitUSD){
  if(!p || !l || l.pay === 'salaire') return 0;
  if(l.pay === 'pct') return unitUSD * num(l.pct) / 100;
  const c = commFor(p, l.city);
  return p.commMode === 'pct' ? unitUSD * c / 100 : c;
}
// Commission du produit pour une ville (valeur propre à la ville si renseignée, sinon valeur générale)
function commFor(p, city){
  const cc = p && p.commCity;
  if(city && cc){ const k = Object.keys(cc).find(x => norm0(x) === norm0(city)); if(k && cc[k] !== '' && cc[k] != null) return num(cc[k]); }
  return num(p && p.comm);
}
const norm0 = t => String(t||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const commVal = (p, v) => p.commMode === 'pct' ? fmt(v) + ' %' : money(v);
const commTxt = p => commVal(p, num(p.comm)) + (p.commCity && Object.keys(p.commCity).length ? ' · ' + Object.entries(p.commCity).map(([c,v]) => esc(c) + ' ' + commVal(p, num(v))).join(' · ') : '');
const payTxt = l => l.pay === 'salaire' ? 'Salaire ' + money(num(l.salary)) + ' / mois' : l.pay === 'pct' ? fmt(num(l.pct)) + ' % de chaque vente' : 'Commission selon le produit';
function inPer(date, p){
  if(p === 'tout') return true;
  const t = today();
  if(p === 'jour') return date === t;
  if(p === 'sem') return date >= weekStart() && date <= t;
  if(p === 'mois') return (date||'').slice(0,7) === t.slice(0,7);
  return true;
}
function livStats(id){
  const r = {got:0, back:0, sold:0, pend:0, lost:0, cash:0, paid:0, earned:0, commPaid:0, week:0, weekN:0, weekPot:0, weekByProd:{}, salMonth:0, nLiv:0, nPend:0, byProd:{}};
  const mo = today().slice(0,7);
  const ws = weekStart();
  const P = pid => r.byProd[pid] = r.byProd[pid] || {got:0, sold:0, pend:0, back:0, lost:0};
  for(const m of S.moves){
    if(m.liv !== id && m.loc !== id) continue;
    if(m.type === 'versement'){ r.paid += moneyUSD(m); continue; }
    if(m.type === 'paiecomm'){ r.commPaid += num(m.amount); continue; }
    if(m.type === 'depense'){ if(/^Salaire/.test(m.cat||'') && (m.date||'').slice(0,7) === mo) r.salMonth += moneyUSD(m); continue; }
    if(!m.pid) continue;
    for(const [pid, q] of lines(m.pid, m.qty)){
      if(m.type === 'envoi'){ r.got += q; P(pid).got += q; }
      else if(m.type === 'retour'){ r.back += q; P(pid).back += q; }
      else if(m.type === 'perte'){ r.lost += q; P(pid).lost += q; }
      else if(m.type === 'ajust'){ r.got += q; P(pid).got += q; }
      else if(m.type === 'vente' && m.status === 'livre'){ r.sold += q; P(pid).sold += q; }
      else if(m.type === 'vente' && m.status !== 'annule'){ r.pend += q; P(pid).pend += q; }
    }
    if(m.type === 'vente' && m.status === 'livre'){
      const c = m.qty * num(m.commU);
      r.cash += saleUSD(m); r.earned += c; r.nLiv++;
      if(m.date >= ws){ r.week += c; r.weekN++; const W = r.weekByProd[m.pid] = r.weekByProd[m.pid] || {q:0, c:0, a:0}; W.q += m.qty; W.c += c; W.a += saleUSD(m); }
    }
    if(m.type === 'vente' && (m.status === 'attente' || m.status === 'encours')){ r.nPend++; r.weekPot += m.qty * num(m.commU); }
  }
  r.hand = r.got - r.back - r.sold - r.lost - r.pend; // pièces encore en main (hors commandes en cours)
  r.handAll = r.hand + r.pend;                       // y compris les commandes en route
  r.toRemit = r.cash - r.paid;
  r.toPay = r.earned - r.commPaid;
  return r;
}
function stats(p){
  const r = {ca:0, nv:0, cost:0, comm:0, loss:0, dep:0, depCat:{}, pending:0, pendingAmt:0, byProd:{}, byCity:{}, days:{}};
  for(const m of S.moves){
    if(m.type === 'vente'){
      const a = saleUSD(m);
      if(m.status === 'attente' || m.status === 'encours'){ r.pending++; r.pendingAmt += a; }
      if(m.status === 'livre'){
        r.days[m.date] = (r.days[m.date]||0) + a;
        if(inPer(m.date, p)){
          r.ca += a; r.nv++; r.cost += m.qty * num(m.costU); r.comm += m.liv ? m.qty * num(m.commU) : 0;
          const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0}; P.q += m.qty; P.a += a;
          const city = m.liv ? (liv(m.liv)?.city || 'Sans ville') : 'Vente directe (dépôt)';
          const C = r.byCity[city] = r.byCity[city] || {n:0, a:0}; C.n++; C.a += a;
        }
      }
    } else if(m.type === 'perte' && inPer(m.date, p)) r.loss += m.qty * num(m.costU);
    else if(m.type === 'depense' && inPer(m.date, p)){ const a = moneyUSD(m); r.dep += a; r.depCat[m.cat] = (r.depCat[m.cat]||0) + a; }
  }
  r.marge = r.ca - r.cost;
  r.net = r.ca - r.cost - r.comm - r.loss - r.dep;
  return r;
}

// Par produit : entré, vendu (livré, packs décomposés), en cours, perdu ; packs vendus
function prodFlow(){
  const F = {}, g = id => F[id] = F[id] || {in:0, sold:0, pend:0, lost:0, packs:0};
  for(const m of S.moves){
    if(!m.pid) continue;
    if(m.type === 'vente' && m.status !== 'annule' && isKit(prod(m.pid)) && m.status === 'livre') g(m.pid).packs += m.qty;
    for(const [pid, q] of lines(m.pid, m.qty)){
      if(m.type === 'entree' || m.type === 'ajust') g(pid).in += q;
      else if(m.type === 'vente' && m.status === 'livre') g(pid).sold += q;
      else if(m.type === 'vente' && m.status !== 'annule') g(pid).pend += q;
      else if(m.type === 'perte') g(pid).lost += q;
    }
  }
  return F;
}

const cityOfSale = m => m.liv ? (liv(m.liv)?.city || 'Sans ville') : 'Dépôt';
function saleRows(){
  const q = saleQ.trim().toLowerCase();
  const list = sortMoves(S.moves.filter(m => m.type === 'vente' && m.status === saleTab && (!saleCity || cityOfSale(m) === saleCity) &&

const BOOKTYPES = [['all','Tout'],['entree','Entrées'],['envoi','Envois livreurs'],['vente','Ventes'],['sortie','Retours / pertes'],['argent','Argent']];
function bookMatch(m){
  if(bookType === 'all') return true;
  if(bookType === 'sortie') return m.type === 'retour' || m.type === 'perte' || m.type === 'ajust' || m.type === 'inventaire';
  if(bookType === 'argent') return ['versement','paiecomm','depense'].includes(m.type);
  return m.type === bookType;
}
function vLivre(){
  return `${periodChips(bookPeriod,'bper')}
  <div class="chips" style="margin-top:6px">${BOOKTYPES.map(([k,l]) => `<button class="chip ${bookType===k?'on':''}" data-a="btype:${k}">${l}</button>`).join('')}</div>
  <div style="height:10px"></div>
  <input class="search" type="search" placeholder="Rechercher dans le livre…" value="${esc(bookQ)}" oninput="bookQ=this.value;refreshList('livre')">
  <div id="lst">${bookRows()}</div>`;
}
function bookRows(){
  const q = bookQ.trim().toLowerCase();
  const list = sortMoves(S.moves.filter(m => inPer(m.date, bookPeriod) && bookMatch(m) &&
    (!q || [m.pid ? pname(m.pid) : '', m.client, m.note, m.motif, m.cat, lname(m.liv||m.loc)].join(' ').toLowerCase().includes(q))));
  if(!list.length) return `<div class="list"><div class="empty"><b>Aucune opération</b>Rien d'enregistré pour cette période.</div></div>`;
  let html = '', cur = null, buf = [];
  const flush = () => { if(buf.length) html += `<div class="sec" style="margin:16px 0 8px"><h2 style="font-size:13px;color:var(--muted)">${fmtDate(cur, true)}</h2></div><div class="list">${buf.join('')}</div>`; buf = []; };
  list.forEach(m => { if(m.date !== cur){ flush(); cur = m.date; } buf.push(rowMove(m)); });
  flush();
  return html;
}
function rowMove(m){
  if(!m) return '';
  const R = (act, ic, icn, t, d, big, col, sm, strike) => `<button class="it" data-a="${act}:${m.id}"><div class="ic ${ic}">${ico(icn)}</div><div class="m"><div class="t">${t}</div><div class="d">${d}</div></div><div class="r"><div class="big num ${strike?'strike':''}" style="color:${col}">${big}</div><div class="sm num">${sm||''}</div></div></button>`;
  switch(m.type){
    case 'vente': return R('sale', m.status==='annule'?'c-x':'c-out', 'cart', esc(pname(m.pid)), `Vente${m.quick ? ' rapide' : ''} · ${esc(m.client||'Client')} · ${m.liv ? esc(lname(m.liv)) : 'dépôt'}${m.pay ? ' · ' + esc(m.pay) : ''} · <span class="pill p-${m.status}">${STATUS[m.status]}</span>`, '−'+m.qty, 'var(--info)', amt(m.qty*m.price, m.cur), m.status==='annule');
    case 'entree': return R('move', 'c-in', 'in', esc(pname(m.pid)), `Entrée au dépôt${m.note ? ' · ' + esc(m.note) : ''}`, '+'+m.qty, 'var(--ok)', num(m.cost) ? amt(m.qty*num(m.cost), prod(m.pid)?.cur) : '');
    case 'envoi': return R('move', 'c-send', 'send', esc(pname(m.pid)), `Envoyé à ${esc(lname(m.liv))}${m.note ? ' · ' + esc(m.note) : ''}`, '→'+m.qty, 'var(--vio)', '');
    case 'retour': return R('move', 'c-in', 'back', esc(pname(m.pid)), `Retour de ${esc(lname(m.liv))} au dépôt`, '←'+m.qty, 'var(--ok)', '');

const norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function bestProduct(text){
  const st = w => w.length > 4 ? w.replace(/(es|s|x)$/,'') : w;
  const toks = norm(text).replace(/[^a-z0-9]+/g,' ').split(' ').filter(Boolean).map(st);
  const T = ' ' + toks.join(' ') + ' ';
  const packWord = /\b(duo|kit|gamme|combo|ensemble|lot|pack|coffret)\b/.test(norm(text));
  let best = null, bs = 0;
  for(const p of S.products){
    const words = norm(p.name).replace(/[^a-z0-9]+/g,' ').split(' ').filter(w => w.length >= 3 && !['pour','avec','des','les','une','piece','pieces','pack'].includes(w)).map(st);
    if(!words.length) continue;
    const hit = words.filter(w => T.includes(' ' + w + ' ')).length;
    let sc = hit * 10 - (words.length - hit);
    if(isKit(p)) sc += packWord ? 15 : -2;
    if(hit && sc > bs){ bs = sc; best = p.id; }
  }
  return best;
}

let rapWeek = 0;
function weekRange(k){ const s = addDays(weekStart(), -7 * k); return [s, addDays(s, 6)]; }
function weekReport(a, b){
  const inR = d => d >= a && d <= b;
  const r = {ca:0, nv:0, cost:0, comm:0, dep:0, loss:0, byLiv:{}, byProd:{}, decl:0};
  for(const m of S.moves){
    if(m.type === 'vente' && m.status === 'livre' && inR(m.date)){
      const u = saleUSD(m), c = m.liv ? m.qty * num(m.commU) : 0;
      r.ca += u; r.nv++; r.cost += m.qty * num(m.costU); r.comm += c;
      const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0}; P.q += m.qty; P.a += u;
      if(m.liv){ const L = r.byLiv[m.liv] = r.byLiv[m.liv] || {n:0, a:0, c:0, v:0}; L.n++; L.a += u; L.c += c; }
    } else if(m.type === 'versement' && inR(m.date)){ const L = r.byLiv[m.liv] = r.byLiv[m.liv] || {n:0, a:0, c:0, v:0}; L.v += moneyUSD(m); }
    else if(m.type === 'depense' && inR(m.date)) r.dep += moneyUSD(m);
    else if(m.type === 'perte' && inR(m.date)) r.loss += m.qty * num(m.costU);
  }
  r.net = r.ca - r.cost - r.comm - r.dep - r.loss;
  return r;
}

/* ---------- Bilan de la marchandise (depuis le début) ---------- */
function stockBilan(){
  const st = stockAt(), r = {inv:0, invQ:0, ca:0, soldCost:0, soldQ:0, lossCost:0, restQ:0, restBuy:0, restSell:0, comm:0, dep:0, byProd:[]};
  for(const m of S.moves){
    if(m.type === 'entree'){ const p = prod(m.pid); const c = num(m.cost) > 0 ? toUSD(num(m.cost), p && p.cur) : unitCostUSD(p); r.inv += m.qty * c; r.invQ += m.qty; }
    else if(m.type === 'vente' && m.status === 'livre'){ r.ca += saleUSD(m); r.soldCost += m.qty * num(m.costU); r.comm += m.liv ? m.qty * num(m.commU) : 0; }
    else if(m.type === 'perte') r.lossCost += m.qty * num(m.costU);
    else if(m.type === 'depense') r.dep += moneyUSD(m);
  }
  for(const p of S.products.filter(p => !isKit(p))){
    const q = Math.max(0, totalOf(st, p.id)); if(!q) continue;
    const b = q * unitCostUSD(p), v = q * toUSD(num(p.sell), p.cur);
    r.restQ += q; r.restBuy += b; r.restSell += v; r.byProd.push([p, q, b, v]);
  }
  r.recup = r.inv ? r.ca / r.inv * 100 : 0;
  r.netNow = r.ca - r.soldCost - r.comm - r.dep - r.lossCost;
  return r;
}
// Historique jour par jour : stock ajouté (date, produits, valeur), ventes, dépenses, cumuls
function stockHistory(){
  const days = {}, D = d => days[d] = days[d] || {d, addQ:0, addV:0, adds:{}, ca:0, n:0, dep:0, net:0};
  for(const m of S.moves){
    if(!m.date) continue;
    if(m.type === 'entree'){ const p = prod(m.pid), c = num(m.cost) > 0 ? toUSD(num(m.cost), p && p.cur) : unitCostUSD(p), x = D(m.date);
      x.addQ += m.qty; x.addV += m.qty * c; x.adds[m.pid] = (x.adds[m.pid] || 0) + m.qty; }
    else if(m.type === 'vente' && m.status === 'livre'){ const x = D(m.date), u = saleUSD(m); x.ca += u; x.n++; x.net += u - m.qty * num(m.costU) - (m.liv ? m.qty * num(m.commU) : 0); }
    else if(m.type === 'depense'){ const x = D(m.date), v = moneyUSD(m); x.dep += v; x.net -= v; }
    else if(m.type === 'perte'){ const x = D(m.date); x.net -= m.qty * num(m.costU); }
  }
  let inv = 0, ca = 0, net = 0;
  const list = Object.values(days).sort((a,b) => a.d.localeCompare(b.d));
  list.forEach(x => { inv += x.addV; ca += x.ca; net += x.net; x.inv = inv; x.cumCa = ca; x.cumNet = net; });
  return list.reverse();
}
function stockHistoryHTML(){
  const h = stockHistory(); if(!h.length) return '';
  return `<details style="margin-top:8px" open><summary class="note"><b>Historique jour par jour</b> — ajouts de stock, ventes, cumuls</summary>
    <div class="tbw"><table class="tb" style="margin-top:6px"><tr><th>Date</th><th class="rt">Stock ajouté</th><th class="rt">Ventes</th><th class="rt">Total investi</th><th class="rt">Total vendu</th></tr>
    ${h.map(x => `<tr data-a="jourset:${x.d}" style="cursor:pointer"><td style="white-space:nowrap">${dAbs(x.d)}${x.dep ? `<br><span class="note">dép. ${money(x.dep)}</span>` : ''}</td>
      <td class="rt">${x.addQ ? `<b class="num">+${fmt(x.addQ)}</b><br><span class="num note">${money(x.addV)}</span>` : '—'}</td>
      <td class="rt num">${x.n ? money(x.ca) : '—'}</td><td class="rt num">${money(x.inv)}</td><td class="rt num"><b>${money(x.cumCa)}</b></td></tr>
      ${x.addQ ? `<tr data-a="jourset:${x.d}" style="cursor:pointer"><td colspan="5" class="note" style="padding-top:0">➕ ${Object.entries(x.adds).map(([pid,q]) => esc(pname(pid)) + ' <b>' + q + '</b>').join(' · ')}</td></tr>` : ''}`).join('')}</table></div>
    <p class="note" style="margin-top:6px">Touchez une date pour voir le rapport complet de ce jour (bénéfice, détail des ventes).</p></details>`;
}

/* ---------- Photo : réduire une image (produits) ---------- */
function coverImage(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const W = 1100, H = 440, c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d'), k = Math.max(W/img.width, H/img.height), w = img.width*k, h = img.height*k;
      x.drawImage(img, (W-w)/2, (H-h)/2, w, h); res(c.toDataURL('image/jpeg', .68)); }; img.src = r.result; };
    r.readAsDataURL(file); });
}
function smallImage(file, size, q){
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'), k = Math.max(size/img.width, size/img.height), w = img.width*k, h = img.height*k;
      x.fillStyle = '#fff'; x.fillRect(0,0,size,size); x.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      res(c.toDataURL('image/jpeg', q)); }; img.src = r.result; };
    r.readAsDataURL(file); });
}


/* ===== Confettis ===== */
function confetti(n){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(_){}
  const c = document.createElement('canvas'), x = c.getContext('2d'), W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  c.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:120'; document.body.appendChild(c);
  const cols = [getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#8A3B12', '#FBBF24', '#34D399', '#60A5FA', '#F472B6', '#ffffff'];
  const P = Array.from({length:n || 110}, () => ({x:W/2 + (Math.random()-.5)*W*.25, y:H*.35, vx:(Math.random()-.5)*18*devicePixelRatio, vy:(-Math.random()*16-6)*devicePixelRatio, s:(Math.random()*6+4)*devicePixelRatio, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t = 0; const step = () => { t++; x.clearRect(0,0,W,H);
    for(const p of P){ p.vy += .55*devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - t/110); x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); x.restore(); }
    if(t < 110) requestAnimationFrame(step); else c.remove(); };
  requestAnimationFrame(step);
  try{ navigator.vibrate && navigator.vibrate([12,40,12]); }catch(_){}
}
function cheer(msg, n){ confetti(n); toast(msg); }
const onceKey = k => { const key = 'stock_cheer_' + (S.settings.shop||'') + '_' + k; try{ if(localStorage.getItem(key)) return false; localStorage.setItem(key, '1'); }catch(_){} return true; };

function ringSVG(pct, col){ const r = 40, C = 2*Math.PI*r, p = Math.max(0, Math.min(1, pct)), off = C*(1-p);
  return `<svg class="ring" viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="${r}"/><circle class="fg" cx="50" cy="50" r="${r}" stroke="${col}" style="--c:${C.toFixed(1)}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/><text x="50" y="57" text-anchor="middle">${Math.round(pct*100)}%</text></svg>`; }

function homeCheers(){
  const g = S.settings, t = today(), d = caOf(t, t);
  if(num(g.goalDay) > 0 && d >= num(g.goalDay) && onceKey('day_' + t)) return setTimeout(() => cheer("🎯 Objectif du jour atteint ! Bravo 👏", 140), 500);
  const m = caOf(t.slice(0,8) + '01', t);
  if(num(g.goalMonth) > 0 && m >= num(g.goalMonth) && onceKey('month_' + t.slice(0,7))) return setTimeout(() => cheer('🏆 Objectif du mois atteint ! Félicitations 🎉', 180), 500);
  if(d > 0){ let best = 0, days = 0; for(let k = 1; k <= 30; k++){ const x = addDays(t, -k), v = caOf(x, x); if(v > 0) days++; if(v > best) best = v; }
    if(days >= 3 && d > best && onceKey('record_' + t)) setTimeout(() => cheer('🏆 Meilleure journée du mois : ' + money(d) + ' !', 120), 500); }
}

/* ===== Compteurs animés ===== */
function countUp(root){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(_){}
  root.querySelectorAll('.kpi .v').forEach(el => {
    const txt = el.textContent, mm = txt.match(/^(-?)([\d\s  .]*\d(?:,\d+)?)(.*)$/); if(!mm) return;
    const dec = (mm[2].split(',')[1] || '').length, target = parseFloat(mm[2].replace(/[\s  .]/g,'').replace(',', '.')) * (mm[1] ? -1 : 1);
    if(!isFinite(target) || Math.abs(target) < 2) return;
    const f = v => (v < 0 ? '-' : '') + Math.abs(v).toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:dec}) + mm[3];
    const t0 = performance.now(), D = 650; el.textContent = f(0);
    const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3); el.textContent = k < 1 ? f(target * e) : txt; if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ===== Graphiques ===== */
function areaChart(days){
  const W = 320, H = 130, n = days.length, mx = Math.max(1, ...days.map(d => d[1]));
  const X = i => n > 1 ? i * (W / (n - 1)) : W/2, Y = v => H - 8 - (v / mx) * (H - 24);
  const pts = days.map(([d,v], i) => [X(i), Y(v), d, v]);
  let path = `M ${pts[0][0]} ${pts[0][1]}`;
  for(let i = 1; i < pts.length; i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i], cx = (x0 + x1) / 2; path += ` C ${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`; }
  const area = path + ` L ${W} ${H} L 0 ${H} Z`;
  const best = pts.reduce((a,b) => b[3] > a[3] ? b : a, pts[0]);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".35"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pts.map(([x,y,d,v]) => `<circle class="pt" cx="${x}" cy="${y}" r="${v ? 3.6 : 2.2}" fill="${v ? 'var(--brand)' : 'var(--line)'}" data-a="jourset:${d}" vector-effect="non-scaling-stroke"><title>${fmtDate(d)} : ${money(v)}</title></circle>`).join('')}
    </svg><div class="lbl">${days.map(([d], i) => `<span>${i % 2 === 0 || i === n-1 ? +d.slice(8) : ''}</span>`).join('')}</div>
    ${best[3] > 0 ? `<p class="note" style="margin-top:6px">Meilleur jour : <b>${fmtDate(best[2])}</b> · ${money(best[3])} — touchez un point pour voir le jour.</p>` : ''}</div>`;
}
function donutSVG(parts, total, center){
  const r = 42, C = 2*Math.PI*r; let acc = 0;
  const segs = parts.filter(p => p[1] > 0).map(([col, v]) => { const len = total ? v / total * C : 0, s = `<circle cx="60" cy="60" r="${r}" stroke="${col}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"/>`; acc += len; return s; }).join('');
  return `<svg class="donut" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" stroke="var(--line)"/>${segs}<text x="60" y="58" text-anchor="middle" font-size="15">${center[0]}</text><text x="60" y="76" text-anchor="middle" font-size="10" style="font-weight:600;fill:var(--muted)">${center[1]}</text></svg>`;
}

/* ===== Gestes : glisser une vente, tirer pour actualiser ===== */
(() => {
  let sx = 0, sy = 0, el = null, dx = 0, mode = '', suppress = false, ptr = null;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; dx = 0; mode = '';
    el = e.target.closest('[data-sw]');
    if(!el && !document.body.classList.contains('lock') && scrollY <= 0 && !e.target.closest('#ov,#auth,input,textarea,select')) mode = 'ptr-wait';
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    const t = e.touches[0], ddx = t.clientX - sx, ddy = t.clientY - sy;
    if(el && !mode && Math.abs(ddx) > 12 && Math.abs(ddx) > Math.abs(ddy) * 1.3){ mode = 'sw'; const bg = document.createElement('div'); bg.className = 'swbg'; el.parentNode.insertBefore(bg, el); el._bg = bg; }
    if(mode === 'sw'){ dx = ddx; el.style.transform = `translateX(${dx}px)`; el.style.transition = 'none';
      const bg = el._bg; if(bg){ bg.style.top = el.offsetTop + 'px'; bg.style.height = el.offsetHeight + 'px'; bg.style.bottom = 'auto'; bg.className = 'swbg ' + (dx > 0 ? 'ok' : 'ko'); bg.innerHTML = dx > 0 ? '<span>✅ Livré</span><span></span>' : '<span></span><span>Annuler ✕</span>'; } }
    if(mode === 'ptr-wait' && ddy > 10 && Math.abs(ddy) > Math.abs(ddx)){ mode = 'ptr'; ptr = $('#ptr') || document.body.appendChild(Object.assign(document.createElement('div'), {id:'ptr', textContent:'↻'})); }
    if(mode === 'ptr'){ dx = ddy; ptr.classList.toggle('on', ddy > 30); ptr.style.transform = `rotate(${Math.min(ddy, 120) * 3}deg) scale(${ddy > 70 ? 1.1 : 1})`; }
  }, {passive:true});
  document.addEventListener('touchend', () => {
    if(mode === 'sw' && el){ const id = el.dataset.sw, bg = el._bg; suppress = true; setTimeout(() => suppress = false, 350);
      el.style.transition = 'transform .2s'; el.style.transform = '';
      setTimeout(() => { if(bg) bg.remove(); }, 220);
      if(dx > 90) setStatus(id, 'livre', true);
      else if(dx < -90) ask('Annuler cette vente ? Le stock sera remis.', 'Oui, annuler').then(ok => { if(ok) setStatus(id, 'annule', true); });
    }
    if(mode === 'ptr' && ptr){ const go = dx > 70; ptr.classList.add(go ? 'go' : 'x'); ptr.style.transform = '';
      if(go){ Promise.resolve(typeof syncNow === 'function' ? syncNow() : null).catch(() => {}).then(() => { render(); toast('Actualisé ✅'); setTimeout(() => ptr.classList.remove('on','go'), 200); }); }
      else ptr.classList.remove('on','x'); }
    el = null; mode = ''; dx = 0;
  }, {passive:true});
  document.addEventListener('click', e => { if(suppress && e.target.closest('[data-sw]')){ e.stopPropagation(); e.preventDefault(); } }, true);
  // petite vibration au toucher (Android)
  document.addEventListener('click', e => { if(navigator.vibrate && e.target.closest('.btn,button.it,nav.nav button,.fab,.chip,button.kpi')) try{ navigator.vibrate(8); }catch(_){} }, true);
})();

/* ---------- Contrôle de stock (inventaire) ---------- */
function pendingAt(loc, pid){ let q = 0; for(const m of S.moves) if(m.type === 'vente' && (m.liv||'') === loc && (m.status === 'attente' || m.status === 'encours')) for(const [x, n] of lines(m.pid, m.qty)) if(x === pid) q += n; return q; }
function invForm(loc){
  const st = stockAt(), name = loc ? lname(loc) : 'Dépôt (chez vous)', L = liv(loc);
  const rows = S.products.filter(p => !isKit(p)).map(p => [p, qAt(st, loc, p.id) + pendingAt(loc, p.id)]).filter(([p, e]) => e || S.moves.some(m => m.pid === p.id && (m.liv === loc || m.loc === loc) && loc)).sort((a,b) => byName(a[0], b[0]));
  if(!rows.length){ toast(loc ? 'Ce livreur n\'a aucun stock à contrôler' : 'Aucun stock au dépôt'); return; }
  sheet('📋 Contrôle de stock · ' + name, `<p class="note" style="margin-bottom:10px">Comptez les pièces réellement en main${loc ? ' (demandez à ' + esc(L ? L.name : 'votre livreur') + ' de compter, y compris les commandes pas encore livrées)' : ''}, puis tapez le nombre compté. Les écarts sont enregistrés automatiquement.</p>
    <form id="invf"><div class="card tbw"><table class="tb"><tr><th>Produit</th><th class="rt">Attendu</th><th class="rt" style="width:90px">Compté</th></tr>
    ${rows.map(([p,e]) => `<tr><td>${esc(p.name)}</td><td class="rt num"><b>${e}</b></td><td class="rt"><input name="c_${p.id}" type="number" min="0" step="1" value="${e}" style="width:80px;text-align:right" data-exp="${e}"></td></tr>`).join('')}</table></div>
    <div id="invDiff" class="note" style="margin:10px 0"></div>
    <div class="row2">${field('Date du contrôle', `<input name="date" type="date" value="${today()}" max="${today()}">`)}${field('Note', `<input name="note" placeholder="Optionnel">`)}</div>
    <button class="btn primary block">Enregistrer le contrôle</button></form>`);
  const f = $('#invf'), E = f.elements;
  const diff = () => { const out = []; rows.forEach(([p,e]) => { const v = Math.round(num(E['c_' + p.id].value)); if(v !== e) out.push(`${esc(p.name)} : <b class="${v < e ? 'red' : 'green'}">${v - e > 0 ? '+' : ''}${v - e}</b>`); }); $('#invDiff').innerHTML = out.length ? '⚠️ Écarts : ' + out.join(' · ') : '✅ Aucun écart pour le moment'; };
  f.oninput = diff; diff();
  f.onsubmit = e => { e.preventDefault();
    const date = E.date.value || today(), note = E.note.value.trim(), id = uid(), ts = Date.now(), lns = [], add = [];
    rows.forEach(([p,ex]) => { const real = Math.max(0, Math.round(num(E['c_' + p.id].value))); lns.push({pid:p.id, exp:ex, real});
      if(real < ex) add.push({id:uid(), ts:ts+1, type:'perte', pid:p.id, qty:ex - real, loc, motif:'Écart inventaire', costU:unitCostUSD(p), date, note:'Contrôle de stock : attendu ' + ex + ', compté ' + real, inv:id});
      if(real > ex) add.push({id:uid(), ts:ts+1, type:'ajust', pid:p.id, qty:real - ex, loc, date, note:'Contrôle de stock : attendu ' + ex + ', compté ' + real, inv:id}); });
    S.moves.push({id, ts, type:'inventaire', loc, date, lines:lns, note});

/* ---------- Taux de réussite & classement ---------- */
let rankPer = 'sem';
function taux(lid, per){
  const r = {done:0, ko:0, pend:0, ca:0, comm:0};
  for(const m of S.moves) if(m.type === 'vente' && m.liv === lid && inPer(m.date, per)){
    if(m.status === 'livre'){ r.done++; r.ca += saleUSD(m); r.comm += m.qty * num(m.commU); }
    else if(m.status === 'annule') r.ko++; else r.pend++;
  }
  r.pct = r.done + r.ko ? Math.round(r.done / (r.done + r.ko) * 100) : 0;
  return r;
}

  const rows = S.livreurs.map(l => [l, taux(l.id, rankPer)]).sort((a,b) => b[1].ca - a[1].ca || b[1].done - a[1].done);

function cleanPhone(t){ const x = String(t||'').match(/(\+?\d[\d .\-()]{6,}\d)/); if(!x) return ''; let p = x[1].replace(/[ .\-()]/g,''); if(/^243\d{9}$/.test(p)) p = '+' + p; return p; }

/* ---------- Rapport du jour ---------- */
let jourDate = '';
function dayReport(d){
  const r = {d, n:0, pcs:0, ca:0, cost:0, comm:0, dep:0, loss:0, vers:0, byPay:{}, byProd:{}, sales:[], pend:0, pendAmt:0};
  for(const m of S.moves){
    if(m.date !== d) continue;
    if(m.type === 'vente' && m.status === 'livre'){
      const u = saleUSD(m), c = m.liv ? m.qty * num(m.commU) : 0;
      r.n++; r.pcs += m.qty; r.ca += u; r.cost += m.qty * num(m.costU); r.comm += c; r.sales.push(m);
      const k = m.liv ? 'Par les livreurs' : (m.pay || 'Non précisé'); r.byPay[k] = (r.byPay[k] || 0) + u;
      const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0}; P.q += m.qty; P.a += u;
    } else if(m.type === 'vente' && (m.status === 'attente' || m.status === 'encours')){ r.pend++; r.pendAmt += saleUSD(m); }
    else if(m.type === 'depense') r.dep += moneyUSD(m);
    else if(m.type === 'perte') r.loss += m.qty * num(m.costU);
    else if(m.type === 'versement') r.vers += moneyUSD(m);
  }
  r.sales.sort((a,b) => (a.dtime||'').localeCompare(b.dtime||'') || (a.ts||0) - (b.ts||0));
  r.net = r.ca - r.cost - r.comm - r.dep - r.loss;
  return r;
}
const dayName = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
function jourText(r){
  const P = Object.entries(r.byProd).sort((x,y) => y[1].a - x[1].a).map(([id,v]) => `• ${pname(id)} : ${v.q} pièce(s) · ${money(v.a)}`).join('\n');
  const Y = Object.entries(r.byPay).map(([k,v]) => `• ${k} : ${money(v)}`).join('\n');
  return `*${S.settings.shop} — Rapport du jour*\n${dayName(r.d)}\n\nVentes : ${r.n} (${r.pcs} pièce(s)) — *${money(r.ca)}*\n${Y ? Y + '\n' : ''}\nCoût des produits : ${money(r.cost)}${r.comm ? '\nCommissions livreurs : ' + money(r.comm) : ''}\nDépenses du jour : ${money(r.dep)}${r.loss ? '\nPertes : ' + money(r.loss) : ''}\n*Bénéfice du jour : ${money(r.net)}*${r.vers ? '\nVersements reçus des livreurs : ' + money(r.vers) : ''}\n\n*Produits vendus*\n${P || '• aucune vente'}`;
}

/* ---------- Relevé de commissions d'un livreur (semaine lun → sam) ---------- */
let relLiv = '', relWeek = 0;
const dAbs = (iso, long) => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', long ? {weekday:'long', day:'numeric', month:'long', year:'numeric'} : {day:'numeric', month:'short'});
function releveData(lid, k){
  const l = liv(lid), [a, b] = weekRange(k), inR = d => d >= a && d <= b;
  const r = {l, a, b, sales:[], byProd:{}, n:0, pcs:0, cash:0, comm:0, vers:0, commPaid:0, sal:0};
  for(const m of sortMoves(S.moves.filter(m => m.liv === lid && inR(m.date))).reverse()){
    if(m.type === 'vente' && m.status === 'livre'){
      const u = saleUSD(m), c = m.qty * num(m.commU);
      r.sales.push(m); r.n++; r.pcs += m.qty; r.cash += u; r.comm += c;
      const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0, c:0}; P.q += m.qty; P.a += u; P.c += c;
    } else if(m.type === 'versement') r.vers += moneyUSD(m);
    else if(m.type === 'paiecomm') r.commPaid += num(m.amount);
    else if(m.type === 'depense' && /^Salaire/.test(m.cat||'')) r.sal += moneyUSD(m);
  }
  r.s = livStats(lid);
  return r;
}
// Taux appliqué à une vente : « 10 % » ou « 2 $ / pièce »
function rateTxt(m, l){
  const cu = num(m.commU); if(!cu) return '—';
  const p = prod(m.pid), unit = m.qty ? saleUSD(m) / m.qty : 0;
  if((l && l.pay === 'pct') || (p && p.commMode === 'pct')) return unit ? fmt(cu / unit * 100) + ' %' : money(cu);
  return money(cu) + ' / pièce';
}
function releveText(r){
  const l = r.l, sal = l.pay === 'salaire';
  const P = Object.entries(r.byProd).map(([id,v]) => `• ${pname(id)} : ${v.q} pièce(s) · ${money(v.a)}${sal ? '' : ' → ' + money(v.c)}`).join('\n');
  return `*${S.settings.shop} — Relevé de la semaine*\n${l.name} (${l.city||''})\nDu ${dAbs(r.a, 1)} au ${dAbs(r.b, 1)}\nMode : ${payTxt(l)}\n\n*Livraisons*\n${P || '• aucune livraison'}\n\nVentes livrées : ${r.n} (${r.pcs} pièce(s)) — ${money(r.cash)}\n${sal ? '' : `*Commission de la semaine : ${money(r.comm)}*\nCommission payée cette semaine : ${money(r.commPaid)}\n`}Versé à la boutique cette semaine : ${money(r.vers)}\n\n${sal ? '' : `Commission restant à payer (total) : ${money(r.s.toPay)}\n`}*Argent restant à verser (total) : ${money(r.s.toRemit)}*\n\nMerci pour votre travail 🙏`;
}
