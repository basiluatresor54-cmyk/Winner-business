    </div>
    <div class="sec" style="margin-top:4px"><h2>Envoyer les reçus par WhatsApp</h2></div>
    <div class="stack" style="margin-bottom:6px">
      ${L ? `<a class="btn wa block" href="${waLink(L.phone, rl)}" target="_blank" rel="noopener">${ico('wa')} 1. Bon de livraison → ${esc(L.name)}${L.phone ? '' : ' (choisir le contact)'}</a>` : ''}
      <a class="btn wa block" href="${waLink(m.phone, rc)}" target="_blank" rel="noopener">${ico('wa')} ${L ? '2. ' : ''}Reçu → ${esc(m.client || 'client')}${m.phone ? '' : ' (choisir le contact)'}</a>
    </div>
    <details class="card" style="margin:10px 0 12px"><summary class="note"><b>Voir les messages qui seront envoyés</b></summary>
      ${L ? `<p class="note" style="margin-top:8px"><b>Au livreur :</b></p><pre class="msg">${esc(rl)}</pre>` : ''}
      <p class="note" style="margin-top:8px"><b>Au client :</b></p><pre class="msg">${esc(rc)}</pre></details>
    <div class="f"><span>Statut</span><div class="seg">${Object.entries(STATUS).map(([k,l]) => `<button type="button" class="${m.status===k?'on':''}" data-a="status:${k}" data-id="${m.id}">${l}</button>`).join('')}</div></div>
    <div class="card" style="margin-bottom:12px">
      <div class="dl"><span>Total client</span><span class="num">${total}${m.cur === 'FC' ? ' ≈ ' + money(u) : ''}</span></div>
      <div class="dl"><span>Commission livreur</span><span class="num">${m.liv ? money(m.qty*num(m.commU)) : '—'}</span></div>
      <div class="dl"><span>Bénéfice sur cette vente</span><span class="num">${money(u - m.qty*num(m.costU) - (m.liv ? m.qty*num(m.commU) : 0))}</span></div>
      <div class="dl"><span>Livreur</span><span>${L ? esc(L.name) + ' · ' + esc(L.city||'') + (L.phone ? '<br>' + esc(L.phone) : '') : 'Vente directe (dépôt)'}</span></div>
      <div class="dl"><span>Client</span><span>${esc(m.client || '—')}${m.phone ? '<br>' + esc(m.phone) : ''}</span></div>
      <div class="dl"><span>Adresse</span><span style="white-space:pre-line">${esc(m.addr || '—')}</span></div>
      <div class="dl"><span>Livraison</span><span>${whenTxt(m)}</span></div>
      <div class="dl"><span>Commande du</span><span>${fmtDate(m.date, true)}</span></div>
      ${m.note ? `<div class="dl"><span>Note</span><span>${esc(m.note)}</span></div>` : ''}
    </div>
    <div class="btns"><button class="btn" data-a="editsale:${m.id}">Modifier</button><button class="btn ghost-bad" data-a="delmove:${m.id}">Supprimer</button></div>`);
}
function setStatus(id, st){
  const m = S.moves.find(x => x.id === id); if(!m || m.status === st) return;
  const rec = Object.assign({}, m, {status:st});
  const err = checkStock(S.moves.map(x => x.id === id ? rec : x), [m.pid]);
  if(err){ toast(err); return; }
  m.status = st; save(); render(); saleSheet(id);
  toast(st === 'livre' ? 'Livrée ✅ — commission comptée' : st === 'annule' ? 'Vente annulée — stock remis' : 'Statut : ' + STATUS[st]);
}

/* ---------- Sauvegarde ---------- */
function download(name, text, mime){
  try{
    const url = URL.createObjectURL(new Blob([text], {type:mime}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(e){}
}
function copyText(t){
  try{ navigator.clipboard.writeText(t).then(() => toast('Copié ✅'), () => toast('Sélectionnez le texte et copiez-le')); }
  catch(e){ toast('Sélectionnez le texte et copiez-le'); }
}

function restoreSheet(){
  sheet('Restaurer une sauvegarde', `<p class="note" style="margin-bottom:12px">Attention : les données actuelles seront remplacées.</p>
    <div class="stack"><label class="btn primary block" style="cursor:pointer">Choisir le fichier de sauvegarde<input type="file" accept=".json,application/json,text/plain" id="rfile" hidden></label>
    <p class="note" style="text-align:center">ou collez le texte de la sauvegarde :</p>
    <textarea class="code" id="rtx" placeholder='{"settings":…}'></textarea>
    <button class="btn block" id="rgo">Restaurer depuis le texte</button></div>`);
  const apply = async txt => {
    let d; try{ d = JSON.parse(txt); }catch(e){ toast('Fichier invalide'); return; }
    if(!d || !Array.isArray(d.products) || !Array.isArray(d.moves)){ toast("Ce n'est pas une sauvegarde valide"); return; }
    if(!await ask(`Remplacer les données actuelles par cette sauvegarde (${d.products.length} produits, ${d.moves.length} opérations) ?`, 'Restaurer')) return;
    S = normalize(d); save(); closeSheet(); view = 'home'; render(); toast('Sauvegarde restaurée ✅');
  };
  $('#rfile').onchange = e => { const file = e.target.files[0]; if(!file) return; const r = new FileReader(); r.onload = () => apply(r.result); r.readAsText(file); };
  $('#rgo').onclick = () => apply($('#rtx').value.trim());
}
function csvSheet(){
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const rows = [['Date commande','Livraison','Heure','Produit','Quantité','Prix unitaire','Devise','Total','Total ($)','Commission livreur ($)','Bénéfice ($)','Livreur','Ville','Client','Téléphone','Adresse','Statut','Note']];
  sortMoves(S.moves.filter(m => m.type === 'vente')).forEach(m => { const u = saleUSD(m), c = m.liv ? m.qty*num(m.commU) : 0;
    rows.push([m.date, m.ddate || m.date, m.dtime || '', pname(m.pid), m.qty, m.price, m.cur, m.qty*m.price, r2(u), r2(c), r2(u - m.qty*num(m.costU) - c), m.liv ? lname(m.liv) : 'Dépôt', m.liv ? liv(m.liv)?.city || '' : '', m.client, m.phone, m.addr, STATUS[m.status], m.note]); });
  const csv = '﻿' + rows.map(r => r.map(q).join(';')).join('\n');
  sheet('Exporter les ventes', `<p class="note" style="margin-bottom:12px">${rows.length-1} ventes. Le fichier s'ouvre dans Excel, Google Sheets ou WPS Office.</p>
    <div class="stack"><button class="btn primary block" id="cdl">Télécharger (CSV)</button><button class="btn block" id="ccp">Copier le tableau</button></div>`);
  $('#cdl').onclick = () => { download(`ventes-${slug()}-${today()}.csv`, csv, 'text/csv;charset=utf-8'); toast('Téléchargement lancé'); };
  $('#ccp').onclick = () => copyText(rows.map(r => r.join('\t')).join('\n'));
}

  S.livreurs = src.livreurs.map(([name,phone,city]) => ({id:uid(), name, phone, city, pay:'produit'}));

  if(end && days < 0) return {cls:'bad', txt:`Abonnement expiré depuis le ${dAbs(end, 1)} : lecture seule. Contactez BASILUA TECH.`, short:'Expiré'};
  if(shop.status === 'essai') return {cls:days <= 3 ? 'warn' : 'info', txt:`Essai gratuit : ${days} jour${days>1?'s':''} restant${days>1?'s':''} (jusqu'au ${dAbs(end, 1)}).`, short:'Essai · ' + days + ' j'};
  if(end && days <= 5) return {cls:'warn', txt:`Abonnement actif jusqu'au ${dAbs(end, 1)} (${days} jour${days>1?'s':''}).`, short:'Actif'};
  return {cls:'ok', txt: end ? `Abonnement actif jusqu'au ${dAbs(end, 1)}.` : 'Abonnement actif.', short:'Actif'};
}

/* ---------- Synchronisation des données (produits, livreurs, opérations) ---------- */
// JSON canonique (clés triées) : la base réordonne les clés, il faut comparer le contenu, pas l'ordre.
function cj(v){
  if(Array.isArray(v)) return '[' + v.map(cj).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + cj(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function fnv(str){ let h = 0x811c9dc5; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const KINDS = [['product','products'],['livreur','livreurs'],['move','moves']];
const ARR = {product:'products', livreur:'livreurs', move:'moves'};
let META = {last:null, h:{}};
const SYNC = {busy:false, again:false, state:'idle', pending:0, err:'', t:null};
function loadMeta(){ try{ const m = JSON.parse(localStorage.getItem(KEY + '_sync') || 'null'); if(m && m.h) return m; }catch(_){} return {last:null, h:{}}; }
function saveMeta(){ try{ localStorage.setItem(KEY + '_sync', JSON.stringify(META)); }catch(_){} }
function shopWritable(){ const si = subInfo(ONLINE.shop); return !!ONLINE.shop && (!si || si.cls !== 'bad') && ['proprietaire','gerant'].includes(ONLINE.role); }
function computeDirty(){
  const out = [], seen = new Set();
  for(const [kind, arr] of KINDS) for(const it of S[arr] || []){
    if(!it || it.id == null) continue;
    const key = kind + ':' + it.id; seen.add(key);
    const h = fnv(cj(it));
    if(META.h[key] !== h) out.push({key, kind, id:String(it.id), data:it, deleted:false, h});
  }
  for(const key in META.h) if(!seen.has(key) && META.h[key] !== 'x'){
    const i = key.indexOf(':'); out.push({key, kind:key.slice(0,i), id:key.slice(i+1), data:{id:key.slice(i+1)}, deleted:true, h:'x'});
  }
  return out;
}
async function pushDirty(){
  const d = computeDirty(); SYNC.pending = d.length;
  for(let i = 0; i < d.length; i += 200){
    const batch = d.slice(i, i + 200);
    const {error} = await sb.from('items').upsert(batch.map(x => ({shop_id:ONLINE.shop.id, kind:x.kind, id:x.id, data:x.data, deleted:x.deleted})), {onConflict:'shop_id,kind,id'});
    if(error) throw error;
    batch.forEach(x => META.h[x.key] = x.h); saveMeta();
    SYNC.pending = Math.max(0, SYNC.pending - batch.length); paintSync();
  }
}
function applyRow(r){
  const arrName = ARR[r.kind]; if(!arrName) return false;
  const key = r.kind + ':' + r.id, arr = S[arrName], i = arr.findIndex(x => String(x.id) === String(r.id));
  if(r.deleted){ META.h[key] = 'x'; if(i >= 0){ arr.splice(i, 1); return true; } return false; }
  const h = fnv(cj(r.data));
  if(i >= 0 && fnv(cj(arr[i])) === h){ META.h[key] = h; return false; }
  if(i >= 0) arr[i] = r.data; else arr.push(r.data);
  META.h[key] = h; return true;
}
async function pull(){
  let since = META.last, changed = false;
  for(let page = 0; page < 50; page++){
    let q = sb.from('items').select('kind,id,data,deleted,updated_at').eq('shop_id', ONLINE.shop.id).order('updated_at', {ascending:true}).limit(1000);
    if(since) q = q.gte('updated_at', since);
    const {data, error} = await q;
    if(error) throw error;
    for(const r of data){ if(applyRow(r)) changed = true; if(!META.last || r.updated_at > META.last) META.last = r.updated_at; }
    if(data.length < 1000) break;
    since = data[data.length - 1].updated_at;
  }
  saveMeta();
  return changed;
}
async function refreshShop(){
  const {data, error} = await sb.from('shops').select('id,name,settings,status,paid_until').eq('id', ONLINE.shop.id);
  if(error || !data || !data[0]) return false;
  const row = data[0], before = cj([ONLINE.shop.status, ONLINE.shop.paid_until, ONLINE.shop.name]);
  Object.assign(ONLINE.shop, {status:row.status, paid_until:row.paid_until});
  let changed = before !== cj([row.status, row.paid_until, row.name]);
  // réglages modifiés sur un autre appareil (et rien en attente ici)
  if(cj(row.settings || {}) !== ONLINE.pushed && cj(settingsForCloud()) === ONLINE.pushed){
    Object.assign(S.settings, row.settings || {}, {shop:row.name}); ONLINE.pushed = cj(row.settings || {}); ONLINE.shop.name = row.name; rawSave(); changed = true;
  }
  return changed;
}
async function syncNow(){
  if(!sb || !ONLINE.shop) return;
  if(SYNC.busy){ SYNC.again = true; return; }
  if(navigator.onLine === false){ SYNC.state = 'offline'; paintSync(); return; }
  SYNC.busy = true; SYNC.state = 'sync'; paintSync();
  try{
    let changed = await refreshShop();
    if(shopWritable()) await pushDirty();
    if(await pull()) changed = true;
    if(changed){ rawSave(); render(); }
    SYNC.pending = shopWritable() ? computeDirty().length : 0;
    SYNC.state = SYNC.pending ? 'pending' : 'ok'; SYNC.err = ''; ONLINE.offline = false;
  }catch(e){
    SYNC.state = /fetch|network|load failed/i.test(String(e && e.message)) ? 'offline' : 'error';
    SYNC.err = authErr(e); SYNC.pending = shopWritable() ? computeDirty().length : 0;
  }finally{
    SYNC.busy = false; paintSync();
    if(SYNC.again){ SYNC.again = false; scheduleSync(800); }
  }
}
function scheduleSync(ms = 1500){ clearTimeout(SYNC.t); SYNC.t = setTimeout(syncNow, ms); }
function paintSync(){
  const el = $('#syncpill'); if(!el) return;
  const T = {idle:['…',''], sync:['↻ Synchro…','s-sync'], ok:['✓ En ligne','s-ok'], pending:['⏳ ' + SYNC.pending + ' en attente','s-wait'], offline:['Hors ligne' + (SYNC.pending ? ' · ' + SYNC.pending : ''),'s-off'], error:['⚠ Erreur','s-err']}[SYNC.state] || ['…',''];
  el.textContent = T[0]; el.className = 'syncpill ' + T[1];
}

    ${field('Note', `<input name="note" maxlength="200" placeholder="Optionnel">`)}
    <div class="f"><span>Capture du message Mobile Money (photo)</span><label class="btn block" style="cursor:pointer">📷 Ajouter la capture<input type="file" accept="image/*" id="declPhoto" hidden></label><div id="declPrev" style="margin-top:8px"></div></div>

    S.moves.push({id, type:'decl', liv:ONLINE.shop.livreur_id, amount:a, cur:E.cur.value, rate:rate(), method:E.method.value, ref:E.ref.value.trim(), note:E.note.value.trim(), photo, status:'attente', date:today(), ts:Date.now()});

  };

// Réduit la photo (≈ 1280 px, JPEG) avant l'envoi : rapide même avec une petite connexion
function shrinkImage(file){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : ko(new Error('image')), 'image/jpeg', 0.72);
    };
    img.onerror = () => ko(new Error('image')); img.src = url;
  });
}

const rawRowMove = rowMove;
rowMove = function(m){
  if(m && m.type === 'decl') return `<button class="it" data-a="decllist"><div class="ic c-money">${ico('cash')}</div><div class="m"><div class="t">Versement déclaré par ${esc(lname(m.liv))}</div><div class="d">${esc(m.method || '')}${m.ref ? ' · réf ' + esc(m.ref) : ''} · <span class="pill ${(DSTAT[m.status] || DSTAT.attente)[1]}">${(DSTAT[m.status] || DSTAT.attente)[0]}</span></div></div><div class="r"><div class="num" style="font-weight:700">${amt(num(m.amount), m.cur)}</div></div></button>`;
  return rawRowMove(m);
};
const rawLivSheet2 = livSheet;
livSheet = function(id){
  rawLivSheet2(id);
  const pend = declsOf(id).filter(d => d.status === 'attente');
  if(pend.length && ONLINE.role !== 'livreur') $('#shb').insertAdjacentHTML('afterbegin', `<div class="card" style="margin-bottom:12px;border:2px solid var(--warn)"><b>💸 Versement(s) à confirmer</b><div class="list" style="box-shadow:none;margin-top:6px">${pend.map(d => declRow(d, true)).join('')}</div></div>`);
};

/* ---------- Démarrage ---------- */
(async function boot(){
  if(!sb){ authShell(`<p class="auth-msg">Impossible de charger le module de connexion. Vérifiez votre connexion internet puis rechargez la page.</p><button class="btn primary block" onclick="location.reload()">Recharger</button>`); return; }
  authShell(`<p class="note">Chargement…</p>`);
  const {data:{session}} = await sb.auth.getSession();
  if(session) afterLogin(); else showAuth('login');
  sb.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT' && ONLINE.shop){ ONLINE.shop = null; showAuth('login'); } });
})();

</script>
