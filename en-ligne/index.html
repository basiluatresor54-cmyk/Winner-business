<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock">
<title>Stock & Livreurs</title>
<style>
:root{
  --brand:#0F766E;--brand-ink:#fff;--brand-soft:rgba(15,118,110,.12);
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e7e9ee;
  --ok:#15803d;--ok-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fdf2e1;
  --bad:#b91c1c;--bad-soft:#fdeaea;--info:#1d4ed8;--info-soft:#e8eefc;--vio:#6d28d9;--vio-soft:#f1eafd;
  --r:16px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:calc(12px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.top h1{font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{font-size:12.5px;opacity:.85}
.top .grow{min-width:0;flex:1}

main{max-width:980px;margin:0 auto;padding:16px}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:15px;font-weight:700}
.link{font-size:13px;color:var(--brand);font-weight:650;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--brand);margin-bottom:12px;font-size:14px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0;text-align:left}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:750;margin-top:4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--brand);color:var(--brand-ink)}
.kpi.hero .l,.kpi.hero .s{color:inherit;opacity:.88}
.kpi.hero .v{font-size:28px}
.v.pos{color:var(--ok)}.v.neg{color:var(--bad)}
.kpi.hero .v.neg{color:#fecaca}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.chip b{font-weight:700;margin-left:4px;opacity:.8}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.it:last-child{border-bottom:0}
button.it:active{background:#f7f8fa}
.it .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.it .m{flex:1;min-width:0}
.it .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{text-align:right;flex:none}
.it .big{font-size:20px;font-weight:750;line-height:1.1}
.it .sm{font-size:11.5px;color:var(--muted)}
.c-in{background:var(--ok-soft);color:var(--ok)}
.c-out{background:var(--info-soft);color:var(--info)}
.c-loss{background:var(--warn-soft);color:var(--warn)}
.c-send{background:var(--vio-soft);color:var(--vio)}
.c-money{background:#e9f7f4;color:#0f766e}
.c-x{background:#f0f1f4;color:var(--muted)}
.c-brand{background:var(--brand-soft);color:var(--brand)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-attente{background:var(--warn-soft);color:var(--warn)}
.p-encours{background:var(--info-soft);color:var(--info)}
.p-livre{background:var(--ok-soft);color:var(--ok)}
.p-annule{background:#f0f1f4;color:var(--muted)}
.qty-low{color:var(--warn)}.qty-zero{color:var(--bad)}
.strike{text-decoration:line-through;opacity:.6}
.red{color:var(--bad)}.green{color:var(--ok)}

.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--brand);min-height:2px}
.bars i.z{background:var(--line)}
.bars span{font-size:10px;color:var(--muted)}
.hb{display:flex;align-items:center;gap:10px;padding:8px 0}
.hb .n{width:40%;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{flex:1;height:10px;background:var(--brand-soft);border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--brand);border-radius:6px}
.hb .q{font-size:12.5px;color:var(--muted);width:78px;text-align:right}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:4px 0 12px}
.split i{display:block;height:100%}
.leg{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg:last-child{border-bottom:0}
.leg .dot{width:10px;height:10px;border-radius:3px;flex:none}
.leg .n{flex:1;color:var(--muted)}
.leg .a{font-weight:650}
.leg .p{width:46px;text-align:right;font-size:12px;color:var(--muted)}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tb td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tb tr:last-child td{border-bottom:0}
.tb .rt{text-align:right}
.tbw{overflow-x:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:650;background:#eef0f3;color:var(--ink);min-height:46px;text-decoration:none;font-size:14.5px;text-align:center}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:#1fa855;color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost-bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack>*+*{margin-top:10px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;font-weight:650;margin-bottom:5px}
.f small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.f input,.f select,.f textarea,.search{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;min-height:46px;font-size:16px;outline:none}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.search:focus{border-color:var(--brand)}
.f input[type=color]{padding:4px;height:46px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.search{margin-bottom:12px;background:var(--card)}
.tot{background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.tot b{font-size:17px}
.tot small{width:100%;font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:block;text-align:left;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:10px 4px;border-radius:10px;background:#f0f1f4;font-size:12.5px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg2{grid-template-columns:1fr 1fr}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.colors button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.colors button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv div{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.kv b{display:block;font-size:19px}
.kv span{font-size:11.5px;color:var(--muted)}
.dl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl:last-child{border-bottom:0}
.dl>span:first-child{color:var(--muted)}
.dl>span:last-child{text-align:right;font-weight:650}
.dl.strong>span{color:var(--ink)!important;font-weight:750}
.kitrow{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:8px}
.kitrow select,.kitrow input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:11px;background:#fff;min-height:44px;font-size:15px}
.city{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.menu .it .ic{width:42px;height:42px}

nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav.nav button.on{color:var(--brand)}
nav.nav button.on svg{stroke-width:2.3}
.fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.fab svg{width:28px;height:28px}

.ov{position:fixed;inset:0;z-index:50;background:rgba(15,18,25,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .2s}
.ov.on .sh{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.sh-h h3{font-size:18px;line-height:1.25}
.x{width:36px;height:36px;border-radius:50%;background:#e7e9ee;font-size:22px;line-height:1;color:var(--muted);flex:none}
.sh-b{overflow-y:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(15,18,25,.5);display:grid;place-items:center;padding:24px}
.dlg .card{max-width:380px;width:100%;padding:20px}
.dlg p{margin-bottom:16px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16181d;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);text-align:left;margin-bottom:8px}
.act .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.act b{display:block}
.act small{color:var(--muted);font-size:12.5px}
.paste summary{cursor:pointer;list-style:none;margin-bottom:8px}
.paste summary::-webkit-details-marker{display:none}
.paste textarea{width:100%;min-height:110px;padding:10px 12px;border:1.5px dashed var(--brand);border-radius:11px;background:#fff;font-size:15px;margin-bottom:8px}
pre.msg{white-space:pre-wrap;font:13px/1.45 -apple-system,Roboto,sans-serif;background:#eafbe7;border-radius:10px;padding:10px;margin-top:4px}
details summary{cursor:pointer}

/* ----- version en ligne ----- */
body.authon .top, body.authon nav.nav, body.authon .fab, body.authon main{display:none!important}
#auth{position:fixed;inset:0;z-index:45;overflow-y:auto;background:linear-gradient(180deg,var(--brand) 0,var(--brand) 190px,var(--bg) 190px);padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
.auth-box{max-width:420px;margin:0 auto;background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:24px 20px;text-align:center}
.auth-box h1{font-size:21px;margin:8px 0 2px}
.auth-box form{text-align:left}
.auth-logo{width:58px;height:58px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:0 auto}
.auth-logo svg{width:32px;height:32px}
.auth-msg{color:var(--bad);font-size:13.5px;font-weight:600;min-height:4px;margin:2px 0 10px;text-align:left}
.subban{border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.subban.info{background:var(--info-soft);color:var(--info)}
.subban.warn{background:var(--warn-soft);color:var(--warn)}
.subban.bad{background:var(--bad-soft);color:var(--bad)}
.subban.subsmall{padding:7px 12px;font-size:12.5px;margin-bottom:10px}.subban a.link{color:inherit;text-decoration:underline}
.syncpill{flex:none;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);color:inherit;white-space:nowrap}
.syncpill.s-off,.syncpill.s-wait{background:#fff3;box-shadow:inset 0 0 0 1.5px #fde68a}
.syncpill.s-err{background:#fecaca;color:#7f1d1d}
body.livmode nav.nav{display:none!important}
body.livmode{padding-bottom:24px}
@media (min-width:900px){body.livmode{padding-left:0}}
textarea.code{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;border:1.5px solid var(--line);border-radius:11px}

.tb .num{white-space:nowrap}
/* photos produits */
.ic.pic{padding:0;overflow:hidden;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:22px}.ic.pic img{width:100%;height:100%;object-fit:cover}
/* vente rapide / rapport du jour */
.quickbtn{font-size:18px;padding:16px;margin:4px 0 10px}
.daycard{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:10px;gap:8px}
.qty{display:flex;gap:6px;align-items:center}.qty input{text-align:center;min-width:0}
.okbox{background:#ecfdf5;border:1px solid #a7f3d0}
/* relevé */
.relh .logo{background:var(--brand);color:var(--brand-ink);width:48px;height:48px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.sign div{border-top:1px solid #999;padding-top:6px;font-size:12px;color:var(--muted,#666);text-align:center;margin-top:34px}
@media print{ .relh .logo{border:1px solid #ddd} .tb{font-size:12px}  .top, nav.nav, .fab, .back, .noprint, #toast{display:none!important} body{padding:0!important;background:#fff} main{max-width:none;padding:0} .card,.kpi,.list{box-shadow:none;border:1px solid #ddd} }
@media (min-width:900px){
  body{padding-bottom:24px;padding-left:220px}
  .top{padding-left:24px}
  nav.nav{top:0;bottom:0;right:auto;width:220px;display:flex;flex-direction:column;gap:4px;padding:84px 12px 12px;border-top:0;border-right:1px solid var(--line)}
  nav.nav button{flex-direction:row;gap:12px;padding:12px 14px;font-size:14.5px}
  nav.nav button.on{background:var(--brand-soft)}
  .fab{bottom:28px;right:28px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi.hero{grid-column:auto}
  .ov{align-items:center}
  .sh{border-radius:22px;max-height:88vh}
  .toast{bottom:40px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<button class="fab" data-a="fab" aria-label="Nouvelle opération" id="fab"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav" id="nav"></nav>
<div class="ov" id="ov" hidden><div class="sh" role="dialog" aria-modal="true"><div class="sh-h"><h3 id="sht"></h3><button class="x" data-a="close" aria-label="Fermer">×</button></div><div class="sh-b" id="shb"></div></div></div>
<div id="dlg"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =================================================================
   Gestion de Stock & Livreurs — application web autonome (1 fichier)
   Produits · Stock (dépôt + livreurs) · Ventes · Livreurs par ville
   Commissions · Versements · Dépenses · Bénéfice final
   Données enregistrées sur l'appareil (localStorage).
   ================================================================= */
let KEY = 'stock_online_none'; // remplacé par la boutique connectée

const PRESET = null; // version vierge à revendre
const GENERIC = {
  products:[['g1','Sac antivol','Accessoires','$',15,2],['g2','Crème visage','Beauté','$',10,2],['g3','Savon naturel','Beauté','FC',15000,1],['g4','Coffret crème + savon','Beauté','$',22,3,[['g2',1],['g3',1]]]],
  livreurs:[['Patrick','','Kinshasa'],['Grâce','','Kinshasa'],['Aimé','','Lubumbashi']]
};

const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  truck:'<path d="M2 6h12v10H2zM14 9h4.5L22 12.5V16h-8"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17.5" cy="17.5" r="1.8"/>',
  user:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3.5 5.5"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  set:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',

/* ---------- Calculs : stock ---------- */
// Un pack (kit) se décompose en ses produits ; le stock est tenu sur les produits simples.
function lines(pid, qty){ const p = prod(pid); return isKit(p) ? p.kit.map(c => [c.pid, c.q*qty]) : [[pid, qty]]; }
const isOutSale = m => m.type === 'vente' && m.status !== 'annule';
function stockAt(moves = S.moves){
  const st = {};
  const add = (loc, pid, q) => { const L = st[loc] = st[loc] || {}; L[pid] = (L[pid]||0) + q; };
  for(const m of moves){
    if(!m.pid) continue;
    for(const [pid, q] of lines(m.pid, m.qty)){
      if(m.type === 'entree') add('', pid, q);
      else if(m.type === 'envoi'){ add('', pid, -q); add(m.liv, pid, q); }
      else if(m.type === 'retour'){ add(m.liv, pid, -q); add('', pid, q); }
      else if(isOutSale(m)) add(m.liv||'', pid, -q);
      else if(m.type === 'perte') add(m.loc||'', pid, -q);
      else if(m.type === 'ajust') add(m.loc||'', pid, q);
    }
  }
  return st;
}
const qAt = (st, loc, pid) => (st[loc] && st[loc][pid]) || 0;
function avail(st, loc, pid){ // quantité disponible (packs : nombre de packs possibles)
  const p = prod(pid);
  if(isKit(p)) return Math.max(0, Math.min(...p.kit.map(c => Math.floor(qAt(st, loc, c.pid) / c.q))));
  return qAt(st, loc, pid);
}
function totalOf(st, pid){ let t = 0; for(const loc in st) t += st[loc][pid]||0; return t; }
function inHands(st, pid){ let t = 0; for(const loc in st) if(loc) t += st[loc][pid]||0; return t; }
// Vérifie qu'aucun stock ne devient négatif après une modification
function checkStock(newMoves, pids){
  const st = stockAt(newMoves);
  const set = new Set(); pids.forEach(id => lines(id, 1).forEach(([p]) => set.add(p)));
  for(const loc in st) for(const pid of set) if((st[loc][pid]||0) < 0)
    return `Stock insuffisant : ${pname(pid)} ${locName(loc)} (il manque ${-st[loc][pid]})`;
  return '';
}

/* ---------- Calculs : argent ---------- */
const saleUSD = m => toUSD(m.qty * m.price, m.cur, m.rate);
const moneyUSD = m => toUSD(m.amount, m.cur, m.rate);
function unitCostUSD(p){
  if(!p) return 0;
  if(num(p.buy) > 0) return toUSD(num(p.buy), p.cur);
  if(isKit(p)) return p.kit.reduce((s,c) => s + unitCostUSD(prod(c.pid)) * c.q, 0);
  return 0;
}
// Commission d'un livreur pour 1 pièce : selon le produit (montant fixe ou %), ou % propre au livreur, ou 0 si salarié
function commUFor(p, l, unitUSD){
  if(!p || !l || l.pay === 'salaire') return 0;
  if(l.pay === 'pct') return unitUSD * num(l.pct) / 100;
  const c = commFor(p, l.city);
  return p.commMode === 'pct' ? unitUSD * c / 100 : c;
}
// Commission du produit pour une ville (valeur propre à la ville si renseignée, sinon valeur générale)
function commFor(p, city){
  const cc = p && p.commCity;
  if(city && cc){ const k = Object.keys(cc).find(x => norm0(x) === norm0(city)); if(k && cc[k] !== '' && cc[k] != null) return num(cc[k]); }
  return num(p && p.comm);
}
const norm0 = t => String(t||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const commVal = (p, v) => p.commMode === 'pct' ? fmt(v) + ' %' : money(v);
const commTxt = p => commVal(p, num(p.comm)) + (p.commCity && Object.keys(p.commCity).length ? ' · ' + Object.entries(p.commCity).map(([c,v]) => esc(c) + ' ' + commVal(p, num(v))).join(' · ') : '');
const payTxt = l => l.pay === 'salaire' ? 'Salaire ' + money(num(l.salary)) + ' / mois' : l.pay === 'pct' ? fmt(num(l.pct)) + ' % de chaque vente' : 'Commission selon le produit';
function inPer(date, p){
  if(p === 'tout') return true;
  const t = today();
  if(p === 'jour') return date === t;
  if(p === 'sem') return date >= weekStart() && date <= t;
  if(p === 'mois') return (date||'').slice(0,7) === t.slice(0,7);
  return true;
}
function livStats(id){
  const r = {got:0, back:0, sold:0, pend:0, lost:0, cash:0, paid:0, earned:0, commPaid:0, week:0, weekN:0, weekPot:0, weekByProd:{}, salMonth:0, nLiv:0, nPend:0, byProd:{}};
  const mo = today().slice(0,7);
  const ws = weekStart();
  const P = pid => r.byProd[pid] = r.byProd[pid] || {got:0, sold:0, pend:0, back:0, lost:0};
  for(const m of S.moves){
    if(m.liv !== id && m.loc !== id) continue;
    if(m.type === 'versement'){ r.paid += moneyUSD(m); continue; }
    if(m.type === 'paiecomm'){ r.commPaid += num(m.amount); continue; }
    if(m.type === 'depense'){ if(/^Salaire/.test(m.cat||'') && (m.date||'').slice(0,7) === mo) r.salMonth += moneyUSD(m); continue; }
    if(!m.pid) continue;
    for(const [pid, q] of lines(m.pid, m.qty)){
      if(m.type === 'envoi'){ r.got += q; P(pid).got += q; }
      else if(m.type === 'retour'){ r.back += q; P(pid).back += q; }
      else if(m.type === 'perte'){ r.lost += q; P(pid).lost += q; }
      else if(m.type === 'ajust'){ r.got += q; P(pid).got += q; }
      else if(m.type === 'vente' && m.status === 'livre'){ r.sold += q; P(pid).sold += q; }
      else if(m.type === 'vente' && m.status !== 'annule'){ r.pend += q; P(pid).pend += q; }
    }
    if(m.type === 'vente' && m.status === 'livre'){
      const c = m.qty * num(m.commU);
      r.cash += saleUSD(m); r.earned += c; r.nLiv++;
      if(m.date >= ws){ r.week += c; r.weekN++; const W = r.weekByProd[m.pid] = r.weekByProd[m.pid] || {q:0, c:0, a:0}; W.q += m.qty; W.c += c; W.a += saleUSD(m); }
    }
    if(m.type === 'vente' && (m.status === 'attente' || m.status === 'encours')){ r.nPend++; r.weekPot += m.qty * num(m.commU); }
  }
  r.hand = r.got - r.back - r.sold - r.lost - r.pend; // pièces encore en main (hors commandes en cours)
  r.handAll = r.hand + r.pend;                       // y compris les commandes en route
  r.toRemit = r.cash - r.paid;
  r.toPay = r.earned - r.commPaid;
  return r;
}
function stats(p){
  const r = {ca:0, nv:0, cost:0, comm:0, loss:0, dep:0, depCat:{}, pending:0, pendingAmt:0, byProd:{}, byCity:{}, days:{}};
  for(const m of S.moves){
    if(m.type === 'vente'){
      const a = saleUSD(m);
      if(m.status === 'attente' || m.status === 'encours'){ r.pending++; r.pendingAmt += a; }
      if(m.status === 'livre'){
        r.days[m.date] = (r.days[m.date]||0) + a;
        if(inPer(m.date, p)){
          r.ca += a; r.nv++; r.cost += m.qty * num(m.costU); r.comm += m.liv ? m.qty * num(m.commU) : 0;
          const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0}; P.q += m.qty; P.a += a;
          const city = m.liv ? (liv(m.liv)?.city || 'Sans ville') : 'Vente directe (dépôt)';
          const C = r.byCity[city] = r.byCity[city] || {n:0, a:0}; C.n++; C.a += a;
        }
      }
    } else if(m.type === 'perte' && inPer(m.date, p)) r.loss += m.qty * num(m.costU);
    else if(m.type === 'depense' && inPer(m.date, p)){ const a = moneyUSD(m); r.dep += a; r.depCat[m.cat] = (r.depCat[m.cat]||0) + a; }
  }
  r.marge = r.ca - r.cost;
  r.net = r.ca - r.cost - r.comm - r.loss - r.dep;
  return r;
}

  <div class="card"><div class="bars">${days.map(([d,v]) => `<div title="${fmtDate(d)} : ${money(v)}" data-a="jourset:${d}" style="cursor:pointer"><i class="${v?'':'z'}" style="height:${mx ? Math.max(3, v/mx*82) : 3}%"></i><span>${+d.slice(8)}</span></div>`).join('')}</div></div>

  <div class="sec"><h2>Meilleurs produits ${per}</h2></div>
  <div class="card">${top.length ? top.map(([id,v]) => `<div class="hb"><div class="n">${esc(pname(id))}</div><div class="tr"><i style="width:${v.a/tmax*100}%"></i></div><div class="q num">${v.q} · ${money(v.a)}</div></div>`).join('') : `<div class="empty" style="padding:12px">Aucune vente livrée ${per}</div>`}</div>

  <div class="list">${low.length ? low.sort(byName).map(p => { const q = totalOf(st,p.id); return `<button class="it" data-a="prod:${p.id}"><div class="ic c-loss">${ico('box')}</div><div class="m"><div class="t">${esc(p.name)}</div><div class="d">${q<=0?'Rupture de stock':'Dépôt '+qAt(st,'',p.id)+' · Livreurs '+inHands(st,p.id)}</div></div><div class="r"><div class="big num ${q<=0?'qty-zero':'qty-low'}">${q}</div><div class="sm">total</div></div></button>`; }).join('') : `<div class="empty">Aucun produit en stock bas ✅</div>`}</div>

/* ---------- Stock ---------- */
function vStock(){
  return `<input class="search" type="search" placeholder="Rechercher un produit…" value="${esc(stockQ)}" oninput="stockQ=this.value;refreshList('stock')">
  <div id="lst">${stockRows()}</div>
  <div class="btns" style="margin-top:12px"><button class="btn" data-a="new:entree">+ Entrée de stock</button><button class="btn" data-a="new:envoi">Envoyer à un livreur</button></div>
  <div style="margin-top:8px"><button class="btn block" data-a="new:produit">+ Nouveau produit</button></div>
  <div style="margin-top:8px"><button class="btn block" data-a="invform:">📋 Contrôle de stock du dépôt</button></div>
  ${invHistHTML('')}`;
}
function stockRows(){
  if(!S.products.length) return `<div class="list"><div class="empty"><b>Aucun produit</b>Ajoutez votre premier produit.</div></div>`;
  const st = stockAt(), q = stockQ.trim().toLowerCase();
  const match = p => !q || (p.name + ' ' + (p.cat||'')).toLowerCase().includes(q);
  const simple = S.products.filter(p => !isKit(p) && match(p)).sort(byName);
  const kits = S.products.filter(p => isKit(p) && match(p)).sort(byName);
  let units = 0, dep = 0, hand = 0;
  S.products.filter(p => !isKit(p)).forEach(p => { units += totalOf(st,p.id); dep += qAt(st,'',p.id); hand += inHands(st,p.id); });
  const row = p => { const tot = totalOf(st,p.id), cls = tot<=0 ? 'qty-zero' : tot<=(p.alert||0) ? 'qty-low' : '';
    return `<button class="it" data-a="prod:${p.id}">${pic(p)}
      <div class="m"><div class="t">${esc(p.name)}</div><div class="d">Dépôt <b>${qAt(st,'',p.id)}</b> · Chez livreurs <b>${inHands(st,p.id)}</b></div><div class="d">${priceTxt(p)} · achat ${num(p.buy)>0 ? amt(p.buy, p.cur) : '?'} · commission ${commTxt(p)}${num(p.buy)>0?'':' · <span class="red">prix d\'achat ?</span>'}</div></div>
      <div class="r"><div class="big num ${cls}">${tot}</div><div class="sm">total</div></div></button>`; };
  const krow = p => `<button class="it" data-a="prod:${p.id}">${p.photo ? pic(p) : `<div class="ic c-send">${ico('tag')}</div>`}
      <div class="m"><div class="t">${esc(p.name)}</div><div class="d">Pack : ${p.kit.map(c => c.q + ' × ' + esc(pname(c.pid))).join(' + ')}</div><div class="d">${priceTxt(p)} · commission ${commTxt(p)}</div></div>
      <div class="r"><div class="big num">${avail(st,'',p.id)}</div><div class="sm">possibles<br>au dépôt</div></div></button>`;
  return `<div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><div class="l">Au dépôt</div><div class="v num">${fmt(dep)}</div><div class="s">pièces chez vous</div></div>
      <div class="kpi"><div class="l">Chez les livreurs</div><div class="v num">${fmt(hand)}</div><div class="s">pièces confiées</div></div></div>
    <div class="list">${simple.length ? simple.map(row).join('') : '<div class="empty">Aucun résultat</div>'}</div>
    ${kits.length ? `<div class="sec"><h2>Packs</h2><span class="note">le stock vient des produits</span></div><div class="list">${kits.map(krow).join('')}</div>` : ''}`;
}

/* ---------- Ventes ---------- */
function vVentes(){
  const all = S.moves.filter(m => m.type === 'vente' && (!saleCity || cityOfSale(m) === saleCity));
  const cnt = k => all.filter(m => m.status === k).length;
  const cs = [...new Set(S.moves.filter(m => m.type === 'vente').map(cityOfSale))].sort();
  return `<div class="chips">${Object.entries(STATUS).map(([k,l]) => `<button class="chip ${saleTab===k?'on':''}" data-a="stab:${k}">${l}<b>${cnt(k)}</b></button>`).join('')}</div>
  ${cs.length > 1 ? `<div class="chips" style="margin-top:6px"><button class="chip ${!saleCity?'on':''}" data-a="scity:">Toutes les villes</button>${cs.map(c => `<button class="chip ${saleCity===c?'on':''}" data-a="scity:${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
  <div style="height:10px"></div>
  <input class="search" type="search" placeholder="Rechercher client, produit, livreur…" value="${esc(saleQ)}" oninput="saleQ=this.value;refreshList('ventes')">
  <div class="list" id="lst">${saleRows()}</div>
  <div style="margin-top:12px"><button class="btn primary block" data-a="new:vente">+ Nouvelle vente</button></div>`;
}
const cityOfSale = m => m.liv ? (liv(m.liv)?.city || 'Sans ville') : 'Dépôt';
function saleRows(){
  const q = saleQ.trim().toLowerCase();
  const list = sortMoves(S.moves.filter(m => m.type === 'vente' && m.status === saleTab && (!saleCity || cityOfSale(m) === saleCity) &&
    (!q || [pname(m.pid), m.client, m.phone, m.addr, lname(m.liv)].join(' ').toLowerCase().includes(q))));
  if(saleTab === 'attente' || saleTab === 'encours') list.sort((a,b) => ((a.ddate||a.date) + (a.dtime||'99')).localeCompare((b.ddate||b.date) + (b.dtime||'99')));
  if(!list.length) return `<div class="empty"><b>Aucune vente « ${STATUS[saleTab]} »</b>${saleTab==='attente'?'Les commandes à livrer apparaîtront ici.':''}</div>`;
  const tot = list.reduce((s,m) => s + saleUSD(m), 0);
  return `<div class="it" style="background:#fafbfc"><div class="m"><div class="d">${list.length} vente${list.length>1?'s':''}</div></div><div class="r"><b class="num">${money(tot)}</b></div></div>` + list.map(rowSale).join('');
}
function rowSale(m){
  const L = liv(m.liv);
  return `<button class="it" data-a="sale:${m.id}"><div class="ic c-out">${ico('cart')}</div>
    <div class="m"><div class="t">${esc(pname(m.pid))} × ${m.qty}</div>
    <div class="d">${esc(m.client || 'Client')}${m.addr ? ' · ' + esc(m.addr) : ''}</div>
    <div class="d">📅 ${fmtDate(m.ddate || m.date)}${m.dtime ? ' ' + m.dtime.replace(':','h') : ''} · ${L ? '🛵 ' + esc(L.name) + ' (' + esc(L.city||'') + ')' : 'Vente directe'}</div></div>
    <div class="r"><div class="num ${m.status==='annule'?'strike':''}" style="font-weight:700">${amt(m.qty*m.price, m.cur)}</div><span class="pill p-${m.status}">${STATUS[m.status]}</span></div></button>`;
}

/* ---------- Livreurs ---------- */
function vLivreurs(){
  if(!S.livreurs.length) return `<div class="card empty"><b>Aucun livreur</b>Ajoutez vos livreurs et leur ville pour leur confier du stock.<div style="margin-top:14px"><button class="btn primary block" data-a="newliv">+ Ajouter un livreur</button></div></div>`;
  let remit = 0, topay = 0, hand = 0, week = 0;
  const S2 = {}; S.livreurs.forEach(l => { const s = S2[l.id] = livStats(l.id); remit += s.toRemit; topay += s.toPay; hand += s.hand; week += s.week; });
  let h = `<div class="kpis">
    <div class="kpi"><div class="l">Pièces disponibles chez les livreurs</div><div class="v num">${fmt(hand)}</div><div class="s">${S.livreurs.length} livreur${S.livreurs.length>1?'s':''} · ${cities().length} ville${cities().length>1?'s':''}</div></div>
    <div class="kpi"><div class="l">Argent à verser</div><div class="v num ${remit>0.009?'neg':''}">${money(remit)}</div><div class="s">encaissé, pas encore versé</div></div>
    <div class="kpi"><div class="l">Commissions à payer</div><div class="v num">${money(topay)}</div><div class="s">dont cette semaine : ${money(week)}</div></div>
  </div>`;
  h += `<button class="btn primary block" style="margin-top:12px" data-a="soir">🌙 Point du soir (message WhatsApp à chaque livreur)</button>`;
  h += rankHTML();
  const ranked = S.livreurs.slice().sort((a,b) => S2[b.id].week - S2[a.id].week || S2[b.id].weekN - S2[a.id].weekN);
  h += `<div class="sec"><h2>Gains de la semaine (lun–sam)</h2><span class="note">depuis ${fmtDate(weekStart())}</span></div>
    <div class="card tbw"><table class="tb"><tr><th>Livreur</th><th class="rt">Livrées</th><th class="rt">Gagné</th><th class="rt">Si en cours livrées</th></tr>
    ${ranked.map(l => { const s = S2[l.id]; return `<tr data-a="liv:${l.id}" style="cursor:pointer"><td><b>${esc(l.name)}</b><br><span class="note">${esc(l.city||'')}</span></td><td class="rt num">${s.weekN}</td><td class="rt num"><b>${l.pay==='salaire' ? 'Salaire' : money(s.week)}</b></td><td class="rt num">${l.pay==='salaire' ? '—' : money(s.week + s.weekPot)}</td></tr>`; }).join('')}</table>
    <p class="note" style="margin-top:6px">« Gagné » = commissions des ventes livrées depuis lundi. La dernière colonne montre ce qu'il gagnera si ses commandes en cours sont livrées.</p></div>`;
  for(const c of cities()){
    const ls = S.livreurs.filter(l => (l.city || 'Sans ville') === c).sort(byName);
    h += `<div class="city">📍 ${esc(c)} · ${ls.length} livreur${ls.length>1?'s':''}</div><div class="list">` + ls.map(l => { const s = S2[l.id];
      return `<button class="it" data-a="liv:${l.id}"><div class="ic c-brand">${esc(initials(l.name))}</div>
        <div class="m"><div class="t">${esc(l.name)}</div><div class="d">En main <b>${s.hand}</b> pièce(s) · livrées ${s.nLiv}${s.nPend ? ' · en cours ' + s.nPend : ''}</div>
        <div class="d">À verser <b class="${s.toRemit>0.009?'red':''}">${money(s.toRemit)}</b> · ${l.pay==='salaire' ? 'Salaire ' + money(num(l.salary)) + '/mois' : 'Commission due <b>' + money(s.toPay) + '</b>'}</div></div>
        <div class="r">${ico('chev')}</div></button>`; }).join('') + `</div>`;
  }
  return h + `<div style="margin-top:14px"><button class="btn block" data-a="newliv">+ Ajouter un livreur</button></div>`;
}
function livForm(id){
  const l = id ? liv(id) : null;
  const cs = [...new Set(CITIES.concat(cities()))];
  sheet(l ? 'Modifier le livreur' : 'Nouveau livreur', `<form id="lf">
    ${field('Nom *', `<input name="name" required maxlength="40" value="${esc(l?.name)}" placeholder="Ex : Patrick">`)}
    ${field('Téléphone / WhatsApp', `<input name="phone" type="tel" value="${esc(l?.phone)}" placeholder="+243 …">`)}
    ${field('Ville *', `<input name="city" required list="cityl" value="${esc(l?.city)}" placeholder="Ex : Kinshasa"><datalist id="cityl">${cs.map(c => `<option value="${esc(c)}">`).join('')}</datalist>`)}
    ${field('Comment est-il payé ?', `<select name="pay"><option value="produit" ${!l||!l.pay||l.pay==='produit'?'selected':''}>Commission selon chaque produit</option><option value="pct" ${l?.pay==='pct'?'selected':''}>Pourcentage fixe sur chaque vente</option><option value="salaire" ${l?.pay==='salaire'?'selected':''}>Salaire fixe (sans commission)</option></select>`)}
    <div id="payPct">${field('Pourcentage pour ce livreur (%)', `<input name="pct" type="number" step="any" min="0" max="100" value="${esc(l?.pct ?? '')}" placeholder="Ex : 15">`, 'Calculé sur le prix de chaque vente livrée')}</div>
    <div id="paySal">${field('Salaire par mois ($)', `<input name="salary" type="number" step="any" min="0" value="${esc(l?.salary ?? '')}" placeholder="Ex : 100">`, 'Les paiements de salaire sont comptés dans les dépenses')}</div>
    <p class="note" style="margin:-4px 0 12px">Un changement s'applique aux nouvelles ventes, pas aux anciennes.</p>
    <button class="btn primary block">${l ? 'Enregistrer' : 'Ajouter le livreur'}</button>
    ${l ? `<button type="button" class="btn ghost-bad block" style="margin-top:8px" data-a="delliv:${l.id}">Supprimer ce livreur</button>` : ''}</form>`);
  const LE = $('#lf').elements, sw = () => { $('#payPct').hidden = LE.pay.value !== 'pct'; $('#paySal').hidden = LE.pay.value !== 'salaire'; LE.pct.required = LE.pay.value === 'pct'; };
  LE.pay.onchange = sw; sw();
  $('#lf').onsubmit = e => { e.preventDefault(); const E = e.target.elements;
    const d = {name:E.name.value.trim(), phone:E.phone.value.trim(), city:E.city.value.trim(), pay:E.pay.value, pct:num(E.pct.value), salary:num(E.salary.value)};
    if(!d.name || !d.city) return;
    if(l) Object.assign(l, d); else S.livreurs.push(Object.assign({id:uid()}, d));
    save(); closeSheet(); render(); toast(l ? 'Livreur modifié' : 'Livreur ajouté'); };
}
function livSheet(id){
  const l = liv(id); if(!l) return;
  const s = livStats(id), st = stockAt();
  const rows = Object.entries(s.byProd).map(([pid,v]) => [pid, v, qAt(st, id, pid)]).filter(([,v,q]) => v.got || q).sort((a,b) => pname(a[0]).localeCompare(pname(b[0]),'fr'));
  const hist = sortMoves(S.moves.filter(m => m.liv === id || m.loc === id)).slice(0,15);
  const report = livReport(l, s, rows);
  sheet(`${l.name} · ${l.city||''}`, `
    <div class="kv"><div><b class="num">${s.hand}</b><span>En main (dispo)</span></div><div><b class="num">${s.sold}</b><span>Pièces livrées</span></div><div><b class="num">${s.pend}</b><span>En cours</span></div></div>
    <div class="card" style="margin-bottom:12px">

      <div class="dl strong"><span>Reste à verser</span><span class="num ${s.toRemit>0.009?'red':'green'}">${money(s.toRemit)}</span></div>
    </div>
    ${l.pay === 'salaire' ? `<div class="card" style="margin-bottom:12px">
      <div class="dl"><span>Mode de paiement</span><span>Salaire fixe</span></div>
      <div class="dl"><span>Salaire du mois</span><span class="num">${money(num(l.salary))}</span></div>
      <div class="dl"><span>Déjà payé ce mois</span><span class="num">${money(s.salMonth)}</span></div>
      <div class="dl strong"><span>Reste à payer ce mois</span><span class="num">${money(Math.max(0, num(l.salary) - s.salMonth))}</span></div>
    </div>` : `<div class="card" style="margin-bottom:12px">
      <div class="dl"><span>Mode de paiement</span><span>${esc(payTxt(l))}</span></div>
      <div class="dl strong"><span>Gagné cette semaine (lun–sam)</span><span class="num">${money(s.week)} · ${s.weekN} vente(s)</span></div>
      <div class="dl"><span>Si les commandes en cours sont livrées</span><span class="num">${money(s.week + s.weekPot)}</span></div>
      <div class="dl"><span>Commissions gagnées (total)</span><span class="num">${money(s.earned)}</span></div>
      <div class="dl"><span>Déjà payées</span><span class="num">${money(s.commPaid)}</span></div>
      <div class="dl strong"><span>Commission à payer</span><span class="num">${money(s.toPay)}</span></div>
    </div>`}
    <div class="btns" style="margin-bottom:8px">
      <button class="btn primary" data-a="new:envoi" data-liv="${id}">Envoyer du stock</button>
      <button class="btn" data-a="new:vente" data-liv="${id}">Vente</button>
      <button class="btn" data-a="money:versement" data-liv="${id}">Versement reçu</button>
      ${l.pay === 'salaire' ? `<button class="btn" data-a="money:depense" data-liv="${id}" data-cat="Salaire / aide">Payer le salaire</button>` : `<button class="btn" data-a="money:paiecomm" data-liv="${id}">Payer commission</button>`}
      <button class="btn" data-a="new:retour" data-liv="${id}">Retour de stock</button>
      <button class="btn" data-a="editliv:${id}">Modifier</button>
    </div>
    <a class="btn wa block" href="${waLink(l.phone, report)}" target="_blank" rel="noopener">${ico('wa')} Envoyer le point à ${esc(l.name)}</a>
    <button class="btn block" style="margin-top:8px" data-a="invform:${id}">📋 Contrôle de stock (compter ce qu'il a en main)</button>
    ${(() => { const t = taux(id, 'tout'); return t.done + t.ko ? `<div class="card" style="margin-top:10px"><div class="dl"><span>Taux de réussite (depuis le début)</span><span class="num"><b>${t.pct} %</b></span></div><p class="note">${t.done} livrée(s) · ${t.ko} annulée(s)${t.pend ? ' · ' + t.pend + ' en cours' : ''}</p></div>` : ''; })()}
    <button class="btn primary block" style="margin-top:8px" data-a="releve:${id}">📄 Relevé de la semaine (commissions · PDF)</button>
    ${Object.keys(s.weekByProd).length ? `<div class="sec"><h2>Cette semaine, produit par produit</h2></div><div class="card tbw"><table class="tb"><tr><th>Produit</th><th class="rt">Pièces</th><th class="rt">Ventes</th><th class="rt">${l.pay==='salaire'?'':'Commission'}</th></tr>
      ${Object.entries(s.weekByProd).map(([pid,v]) => `<tr><td>${esc(pname(pid))}</td><td class="rt num">${v.q}</td><td class="rt num">${money(v.a)}</td><td class="rt num">${l.pay==='salaire'?'':money(v.c)}</td></tr>`).join('')}</table></div>` : ''}

    ${rows.length ? `<div class="card tbw"><table class="tb"><tr><th>Produit</th><th class="rt">Reçu</th><th class="rt">Livré</th><th class="rt">En cours</th><th class="rt">Reste</th></tr>
      ${rows.map(([pid,v,q]) => `<tr><td>${esc(pname(pid))}</td><td class="rt num">${v.got - v.back}</td><td class="rt num">${v.sold}</td><td class="rt num">${v.pend}</td><td class="rt num"><b>${q}</b></td></tr>`).join('')}</table>
      <p class="note" style="margin-top:6px">« Reste » = pièces en main non réservées. Reçu = envoyé − retourné.</p></div>` : `<div class="card empty">Aucun stock confié pour le moment.</div>`}
    ${flowHTML(id)}
    ${invHistHTML(id)}
    <div class="sec"><h2>Historique</h2></div>

/* ---------- Commande WhatsApp : lecture automatique d'un message collé ---------- */
const norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function bestProduct(text){
  const st = w => w.length > 4 ? w.replace(/(es|s|x)$/,'') : w;
  const toks = norm(text).replace(/[^a-z0-9]+/g,' ').split(' ').filter(Boolean).map(st);
  const T = ' ' + toks.join(' ') + ' ';
  const packWord = /\b(duo|kit|gamme|combo|ensemble|lot|pack|coffret)\b/.test(norm(text));
  let best = null, bs = 0;
  for(const p of S.products){
    const words = norm(p.name).replace(/[^a-z0-9]+/g,' ').split(' ').filter(w => w.length >= 3 && !['pour','avec','des','les','une','piece','pieces','pack'].includes(w)).map(st);
    if(!words.length) continue;
    const hit = words.filter(w => T.includes(' ' + w + ' ')).length;
    let sc = hit * 10 - (words.length - hit);
    if(isKit(p)) sc += packWord ? 15 : -2;
    if(hit && sc > bs){ bs = sc; best = p.id; }
  }
  return best;
}
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function parseOrder(txt){
  const lines = txt.replace(/\r/g,'').split('\n').map(l => l.replace(/^[\s*•\-–—📍📞👤📦🕒⏰📅🛵💵✅]+/u,'').replace(/\*/g,'').trim()).filter(Boolean);
  const lab = re => { for(const l of lines){ const x = l.match(re); if(x && x[1] && x[1].trim()) return x[1].trim(); } return ''; };
  const o = {};
  o.client = lab(/^(?:nom(?:\s+(?:et\s+)?(?:complet|pr[ée]nom))?|client(?:e)?|name)\s*[:=\-–]\s*(.+)$/i);
  // Téléphone (et éventuellement le nom sur la même ligne : « Contact : Jemima - 2438… »)
  const ct = lab(/^(?:t[ée]l[ée]?(?:phone)?|num[ée]ro|contact|whatsapp|phone|tel)\s*[:=\-–]\s*(.+)$/i);
  const numIn = t => { const x = String(t||'').match(/(\+?\d[\d .\-]{7,}\d)/); return x ? x[1] : ''; };
  let ph = numIn(ct) || numIn(txt);
  if(ct && !o.client){ const nm = ct.replace(numIn(ct), '').replace(/[\-–—:,/()]+/g,' ').trim(); if(/[a-zà-ÿ]{2,}/i.test(nm)) o.client = nm; }
  if(ph){ ph = ph.replace(/[ .\-]/g,''); if(/^243\d{9}$/.test(ph)) ph = '+' + ph; o.phone = ph; }
  if(!o.client){ const x = txt.match(/^\s*(?:merci|bonjour|bonsoir|parfait|salut|cher|ch[eè]re)\s+([A-ZÀ-Ÿa-zà-ÿ][\wà-ÿ'\-]+(?:\s+[A-ZÀ-Ÿ][\wà-ÿ'\-]+)?)/i); if(x && !/^(madame|monsieur|maman|papa|pour|beaucoup|a|à|de)$/i.test(x[1])) o.client = x[1]; }
  const city = lab(/^ville\s*[:=\-–]\s*(.+)$/i);
  o.addr = lab(/^(?:adresse(?:\s+(?:compl[èe]te|de\s+livraison))?|address|lieu|localisation|domicile)\s*[:=\-–]\s*(.+)$/i);
  const extra = ['commune','quartier','avenue','av','r[ée]f[ée]rence','rep[èe]re'].map(k => lab(new RegExp('^' + k + '\\.?\\s*[:=\\-–]\\s*(.+)$','i'))).filter(Boolean);
  o.addr = [o.addr].concat(extra).filter(Boolean).join(', ');
  const livLine = lab(/^livraison\s*[:=]\s*(.+)$/i);
  if(!o.addr && livLine && !/^(demain|aujourd|ce soir|\d)/i.test(livLine)) o.addr = livLine.split(/\s[—–-]\s/)[0].trim();
  if(city && !norm(o.addr).includes(norm(city))) o.addr = o.addr ? o.addr + ', ' + city : city;
  // Produit : ligne « Produit : … » sinon la ligne qui ressemble le plus à un produit
  const pl = lab(/^(?:produits?|articles?|commande)\s*[:=\-–]\s*(.+)$/i);
  let pline = pl;
  if(!pline){ let bsc = 0; for(const l of lines){ if(/^(adresse|livraison|heure|contact|t[ée]l|ville|nom)\b/i.test(l)) continue; const id = bestProduct(l); if(id){ const sc = (/(x\s*\d|\d\s*x|\$|fc\b)/i.test(l) ? 2 : 1); if(sc > bsc){ bsc = sc; pline = l; } } } }
  o.pid = bestProduct(pline) || bestProduct(txt);
  const q = lab(/^(?:quantit[ée]|qt[ée]|nombre|nbr?)\s*[:=\-–]\s*(\d+)/i) || ((pline || '').match(/(?:\bx\s*(\d+)|\b(\d+)\s*(?:x\b|pi[eè]ces?|pcs?|bo[iî]tes?|flacons?|pots?))/i) || []).slice(1).find(Boolean);
  if(q) o.qty = parseInt(q, 10);
  if(!o.qty && o.pid){ const ws = norm(prod(o.pid).name).split(/[^a-z0-9]+/).filter(w => w.length >= 3); const x = ws.length && norm(pline || txt).match(new RegExp('\\b(\\d{1,2})\\s*(?:x\\s*)?(?:' + ws.join('|') + ')')); if(x) o.qty = parseInt(x[1], 10); }
  // Prix écrit sur la ligne du produit (« 10$ », « 23 000 FC »)
  if(o.pid && pline){ const P = prod(o.pid), qq = o.qty || 1;
    const usd = pline.match(/(\d+(?:[.,]\d+)?)\s*(?:\$|usd|dollars?)/i), fc = pline.match(/(\d[\d\s.]*\d|\d)\s*(?:fc|francs?)\b/i);
    let v = null; if(P.cur === '$' && usd) v = num(usd[1]); else if(P.cur === 'FC' && fc) v = num(fc[1].replace(/[\s.]/g,'')); else if(P.cur === 'FC' && usd) v = Math.round(num(usd[1]) * rate()); else if(P.cur === '$' && fc) v = r2(num(fc[1].replace(/[\s.]/g,'')) / rate());
    if(v){ const sell = num(P.sell); o.amount = v; o.price = qq > 1 && Math.abs(v - sell*qq) < Math.abs(v - sell) ? r2(v / qq) : v; } }
  // Pack de N pièces identiques : « crème x2 : 10$ » → le pack
  if(o.pid && !isKit(prod(o.pid))){ const qq = o.qty || 1, K = S.products.find(k => isKit(k) && k.kit.length === 1 && k.kit[0].pid === o.pid && qq % k.kit[0].q === 0);
    const v = o.amount, packT = K ? num(K.sell) * qq / K.kit[0].q : 0, oneT = num(prod(o.pid).sell) * qq;
    if(K && (/\b(pack|lot|duo)\b/i.test(norm(pline || txt)) || (v && Math.abs(v - packT) < Math.abs(v - oneT)))){ const n = K.kit[0].q; o.pid = K.id; o.qty = qq / n; if(v) o.price = r2(v / o.qty); } }
  // Jour et heure
  o.when = lab(/^(?:heure|horaire|jour|date|quand|cr[ée]neau|moment)[^:=]*[:=]\s*(.+)$/i);
  if(!o.when && livLine && /(\d+\s*h|demain|aujourd|soir|matin|midi|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)/i.test(livLine)) o.when = livLine;
  const src = o.when || txt;
  const h = src.match(/\b(\d{1,2})\s*(?:h|:)\s*(\d{2})?\b/i);
  if(h && +h[1] < 24) o.dtime = String(h[1]).padStart(2,'0') + ':' + (h[2] || '00');
  if(/apr[eè]s[- ]demain/i.test(src)) o.ddate = addDays(today(), 2);
  else if(/demain/i.test(src)) o.ddate = addDays(today(), 1);
  else if(/aujourd|ce soir|ce matin|cet apr/i.test(src)) o.ddate = today();
  else { const j = JOURS.findIndex(d => norm(src).includes(d)); if(j >= 0){ const now = new Date(today() + 'T12:00:00').getDay(); o.ddate = addDays(today(), ((j - now + 7) % 7) || 7); } }
  if(o.when && /\b(entre|et|vers|avant|apr[eè]s)\b|\d\s*h?\s*[-–à]\s*\d/i.test(o.when)) o.slot = o.when;
  const all = norm(city + ' ' + o.addr + ' ' + txt);
  const L = S.livreurs.find(l => l.city && city && norm(l.city) === norm(city)) || S.livreurs.find(l => l.city && norm(o.addr).includes(norm(l.city))) || S.livreurs.find(l => l.city && all.includes(norm(l.city)));
  if(L){ o.liv = L.id; o.city = L.city; }

let rapWeek = 0;
function weekRange(k){ const s = addDays(weekStart(), -7 * k); return [s, addDays(s, 6)]; }
function weekReport(a, b){
  const inR = d => d >= a && d <= b;
  const r = {ca:0, nv:0, cost:0, comm:0, dep:0, loss:0, byLiv:{}, byProd:{}, decl:0};
  for(const m of S.moves){
    if(m.type === 'vente' && m.status === 'livre' && inR(m.date)){
      const u = saleUSD(m), c = m.liv ? m.qty * num(m.commU) : 0;
      r.ca += u; r.nv++; r.cost += m.qty * num(m.costU); r.comm += c;
      const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0}; P.q += m.qty; P.a += u;
      if(m.liv){ const L = r.byLiv[m.liv] = r.byLiv[m.liv] || {n:0, a:0, c:0, v:0}; L.n++; L.a += u; L.c += c; }
    } else if(m.type === 'versement' && inR(m.date)){ const L = r.byLiv[m.liv] = r.byLiv[m.liv] || {n:0, a:0, c:0, v:0}; L.v += moneyUSD(m); }
    else if(m.type === 'depense' && inR(m.date)) r.dep += moneyUSD(m);
    else if(m.type === 'perte' && inR(m.date)) r.loss += m.qty * num(m.costU);
  }
  r.net = r.ca - r.cost - r.comm - r.dep - r.loss;
  return r;
}

/* ---------- Bilan de la marchandise (depuis le début) ---------- */
function stockBilan(){
  const st = stockAt(), r = {inv:0, invQ:0, ca:0, soldCost:0, soldQ:0, lossCost:0, restQ:0, restBuy:0, restSell:0, comm:0, dep:0, byProd:[]};
  for(const m of S.moves){
    if(m.type === 'entree'){ const p = prod(m.pid); const c = num(m.cost) > 0 ? toUSD(num(m.cost), p && p.cur) : unitCostUSD(p); r.inv += m.qty * c; r.invQ += m.qty; }
    else if(m.type === 'vente' && m.status === 'livre'){ r.ca += saleUSD(m); r.soldCost += m.qty * num(m.costU); r.comm += m.liv ? m.qty * num(m.commU) : 0; }
    else if(m.type === 'perte') r.lossCost += m.qty * num(m.costU);
    else if(m.type === 'depense') r.dep += moneyUSD(m);
  }
  for(const p of S.products.filter(p => !isKit(p))){
    const q = Math.max(0, totalOf(st, p.id)); if(!q) continue;
    const b = q * unitCostUSD(p), v = q * toUSD(num(p.sell), p.cur);
    r.restQ += q; r.restBuy += b; r.restSell += v; r.byProd.push([p, q, b, v]);
  }
  r.recup = r.inv ? r.ca / r.inv * 100 : 0;
  r.netNow = r.ca - r.soldCost - r.comm - r.dep - r.lossCost;
  return r;
}
// Historique jour par jour : stock ajouté (date, produits, valeur), ventes, dépenses, cumuls
function stockHistory(){
  const days = {}, D = d => days[d] = days[d] || {d, addQ:0, addV:0, adds:{}, ca:0, n:0, dep:0, net:0};
  for(const m of S.moves){
    if(!m.date) continue;
    if(m.type === 'entree'){ const p = prod(m.pid), c = num(m.cost) > 0 ? toUSD(num(m.cost), p && p.cur) : unitCostUSD(p), x = D(m.date);
      x.addQ += m.qty; x.addV += m.qty * c; x.adds[m.pid] = (x.adds[m.pid] || 0) + m.qty; }
    else if(m.type === 'vente' && m.status === 'livre'){ const x = D(m.date), u = saleUSD(m); x.ca += u; x.n++; x.net += u - m.qty * num(m.costU) - (m.liv ? m.qty * num(m.commU) : 0); }
    else if(m.type === 'depense'){ const x = D(m.date), v = moneyUSD(m); x.dep += v; x.net -= v; }
    else if(m.type === 'perte'){ const x = D(m.date); x.net -= m.qty * num(m.costU); }
  }
  let inv = 0, ca = 0, net = 0;
  const list = Object.values(days).sort((a,b) => a.d.localeCompare(b.d));
  list.forEach(x => { inv += x.addV; ca += x.ca; net += x.net; x.inv = inv; x.cumCa = ca; x.cumNet = net; });
  return list.reverse();
}
function stockHistoryHTML(){
  const h = stockHistory(); if(!h.length) return '';
  return `<details style="margin-top:8px" open><summary class="note"><b>Historique jour par jour</b> — ajouts de stock, ventes, cumuls</summary>

/* ---------- Photo : réduire une image (produits) ---------- */
function smallImage(file, size, q){
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej;
    r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'), k = Math.max(size/img.width, size/img.height), w = img.width*k, h = img.height*k;
      x.fillStyle = '#fff'; x.fillRect(0,0,size,size); x.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      res(c.toDataURL('image/jpeg', q)); }; img.src = r.result; };
    r.readAsDataURL(file); });
}

function pendingAt(loc, pid){ let q = 0; for(const m of S.moves) if(m.type === 'vente' && (m.liv||'') === loc && (m.status === 'attente' || m.status === 'encours')) for(const [x, n] of lines(m.pid, m.qty)) if(x === pid) q += n; return q; }

  const st = stockAt(), name = loc ? lname(loc) : 'Dépôt (chez vous)', L = liv(loc);

  if(!rows.length){ toast(loc ? 'Ce livreur n\'a aucun stock à contrôler' : 'Aucun stock au dépôt'); return; }

    <form id="invf"><div class="card tbw"><table class="tb"><tr><th>Produit</th><th class="rt">Attendu</th><th class="rt" style="width:90px">Compté</th></tr>
    ${rows.map(([p,e]) => `<tr><td>${esc(p.name)}</td><td class="rt num"><b>${e}</b></td><td class="rt"><input name="c_${p.id}" type="number" min="0" step="1" value="${e}" style="width:80px;text-align:right" data-exp="${e}"></td></tr>`).join('')}</table></div>
    <div id="invDiff" class="note" style="margin:10px 0"></div>
    <div class="row2">${field('Date du contrôle', `<input name="date" type="date" value="${today()}" max="${today()}">`)}${field('Note', `<input name="note" placeholder="Optionnel">`)}</div>
    <button class="btn primary block">Enregistrer le contrôle</button></form>`);
  const f = $('#invf'), E = f.elements;
  const diff = () => { const out = []; rows.forEach(([p,e]) => { const v = Math.round(num(E['c_' + p.id].value)); if(v !== e) out.push(`${esc(p.name)} : <b class="${v < e ? 'red' : 'green'}">${v - e > 0 ? '+' : ''}${v - e}</b>`); }); $('#invDiff').innerHTML = out.length ? '⚠️ Écarts : ' + out.join(' · ') : '✅ Aucun écart pour le moment'; };
  f.oninput = diff; diff();
  f.onsubmit = e => { e.preventDefault();
    const date = E.date.value || today(), note = E.note.value.trim(), id = uid(), ts = Date.now(), lns = [], add = [];
    rows.forEach(([p,ex]) => { const real = Math.max(0, Math.round(num(E['c_' + p.id].value))); lns.push({pid:p.id, exp:ex, real});
      if(real < ex) add.push({id:uid(), ts:ts+1, type:'perte', pid:p.id, qty:ex - real, loc, motif:'Écart inventaire', costU:unitCostUSD(p), date, note:'Contrôle de stock : attendu ' + ex + ', compté ' + real, inv:id});
      if(real > ex) add.push({id:uid(), ts:ts+1, type:'ajust', pid:p.id, qty:real - ex, loc, date, note:'Contrôle de stock : attendu ' + ex + ', compté ' + real, inv:id}); });
    S.moves.push({id, ts, type:'inventaire', loc, date, lines:lns, note});
    S.moves.push(...add); save(); render(); invSheet(id, true);
  };
}

/* ---------- Taux de réussite & classement ---------- */
let rankPer = 'sem';
function taux(lid, per){
  const r = {done:0, ko:0, pend:0, ca:0, comm:0};
  for(const m of S.moves) if(m.type === 'vente' && m.liv === lid && inPer(m.date, per)){
    if(m.status === 'livre'){ r.done++; r.ca += saleUSD(m); r.comm += m.qty * num(m.commU); }
    else if(m.status === 'annule') r.ko++; else r.pend++;
  }
  r.pct = r.done + r.ko ? Math.round(r.done / (r.done + r.ko) * 100) : 0;
  return r;
}
function rankHTML(){
  const rows = S.livreurs.map(l => [l, taux(l.id, rankPer)]).sort((a,b) => b[1].ca - a[1].ca || b[1].done - a[1].done);

/* ---------- Rapport du jour ---------- */
let jourDate = '';
function dayReport(d){
  const r = {d, n:0, pcs:0, ca:0, cost:0, comm:0, dep:0, loss:0, vers:0, byPay:{}, byProd:{}, sales:[], pend:0, pendAmt:0};
  for(const m of S.moves){
    if(m.date !== d) continue;
    if(m.type === 'vente' && m.status === 'livre'){
      const u = saleUSD(m), c = m.liv ? m.qty * num(m.commU) : 0;
      r.n++; r.pcs += m.qty; r.ca += u; r.cost += m.qty * num(m.costU); r.comm += c; r.sales.push(m);
      const k = m.liv ? 'Par les livreurs' : (m.pay || 'Non précisé'); r.byPay[k] = (r.byPay[k] || 0) + u;
      const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0}; P.q += m.qty; P.a += u;
    } else if(m.type === 'vente' && (m.status === 'attente' || m.status === 'encours')){ r.pend++; r.pendAmt += saleUSD(m); }
    else if(m.type === 'depense') r.dep += moneyUSD(m);
    else if(m.type === 'perte') r.loss += m.qty * num(m.costU);
    else if(m.type === 'versement') r.vers += moneyUSD(m);
  }
  r.sales.sort((a,b) => (a.dtime||'').localeCompare(b.dtime||'') || (a.ts||0) - (b.ts||0));
  r.net = r.ca - r.cost - r.comm - r.dep - r.loss;
  return r;
}
const dayName = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
function jourText(r){
  const P = Object.entries(r.byProd).sort((x,y) => y[1].a - x[1].a).map(([id,v]) => `• ${pname(id)} : ${v.q} pièce(s) · ${money(v.a)}`).join('\n');
  const Y = Object.entries(r.byPay).map(([k,v]) => `• ${k} : ${money(v)}`).join('\n');
  return `*${S.settings.shop} — Rapport du jour*\n${dayName(r.d)}\n\nVentes : ${r.n} (${r.pcs} pièce(s)) — *${money(r.ca)}*\n${Y ? Y + '\n' : ''}\nCoût des produits : ${money(r.cost)}${r.comm ? '\nCommissions livreurs : ' + money(r.comm) : ''}\nDépenses du jour : ${money(r.dep)}${r.loss ? '\nPertes : ' + money(r.loss) : ''}\n*Bénéfice du jour : ${money(r.net)}*${r.vers ? '\nVersements reçus des livreurs : ' + money(r.vers) : ''}\n\n*Produits vendus*\n${P || '• aucune vente'}`;
}

/* ---------- Relevé de commissions d'un livreur (semaine lun → sam) ---------- */
let relLiv = '', relWeek = 0;
const dAbs = (iso, long) => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', long ? {weekday:'long', day:'numeric', month:'long', year:'numeric'} : {day:'numeric', month:'short'});
function releveData(lid, k){
  const l = liv(lid), [a, b] = weekRange(k), inR = d => d >= a && d <= b;
  const r = {l, a, b, sales:[], byProd:{}, n:0, pcs:0, cash:0, comm:0, vers:0, commPaid:0, sal:0};
  for(const m of sortMoves(S.moves.filter(m => m.liv === lid && inR(m.date))).reverse()){
    if(m.type === 'vente' && m.status === 'livre'){
      const u = saleUSD(m), c = m.qty * num(m.commU);
      r.sales.push(m); r.n++; r.pcs += m.qty; r.cash += u; r.comm += c;
      const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0, c:0}; P.q += m.qty; P.a += u; P.c += c;
    } else if(m.type === 'versement') r.vers += moneyUSD(m);
    else if(m.type === 'paiecomm') r.commPaid += num(m.amount);
    else if(m.type === 'depense' && /^Salaire/.test(m.cat||'')) r.sal += moneyUSD(m);
  }
  r.s = livStats(lid);
  return r;
}
// Taux appliqué à une vente : « 10 % » ou « 2 $ / pièce »
function rateTxt(m, l){
  const cu = num(m.commU); if(!cu) return '—';
  const p = prod(m.pid), unit = m.qty ? saleUSD(m) / m.qty : 0;
  if((l && l.pay === 'pct') || (p && p.commMode === 'pct')) return unit ? fmt(cu / unit * 100) + ' %' : money(cu);
  return money(cu) + ' / pièce';
}
function releveText(r){
  const l = r.l, sal = l.pay === 'salaire';
  const P = Object.entries(r.byProd).map(([id,v]) => `• ${pname(id)} : ${v.q} pièce(s) · ${money(v.a)}${sal ? '' : ' → ' + money(v.c)}`).join('\n');
  return `*${S.settings.shop} — Relevé de la semaine*\n${l.name} (${l.city||''})\nDu ${dAbs(r.a, 1)} au ${dAbs(r.b, 1)}\nMode : ${payTxt(l)}\n\n*Livraisons*\n${P || '• aucune livraison'}\n\nVentes livrées : ${r.n} (${r.pcs} pièce(s)) — ${money(r.cash)}\n${sal ? '' : `*Commission de la semaine : ${money(r.comm)}*\nCommission payée cette semaine : ${money(r.commPaid)}\n`}Versé à la boutique cette semaine : ${money(r.vers)}\n\n${sal ? '' : `Commission restant à payer (total) : ${money(r.s.toPay)}\n`}*Argent restant à verser (total) : ${money(r.s.toRemit)}*\n\nMerci pour votre travail 🙏`;
}

  const locs = S.livreurs.map(l => [l, kit ? avail(st, l.id, id) : qAt(st, l.id, id)]).filter(x => x[1]);
  sheet(p.name, `${p.photo ? `<img src="${p.photo}" alt="" style="width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin-bottom:12px">` : ''}
    ${kit ? `<div class="warnbox" style="background:var(--vio-soft);color:var(--vio)">Pack : ${p.kit.map(c => c.q + ' × ' + esc(pname(c.pid))).join(' + ')}. Les quantités ci-dessous = nombre de packs possibles.</div>` : ''}
    <div class="kv"><div><b class="num">${kit ? avail(st,'',id) : qAt(st,'',id)}</b><span>Au dépôt</span></div><div><b class="num">${kit ? locs.reduce((s,x)=>s+x[1],0) : inHands(st,id)}</b><span>Chez livreurs</span></div><div><b class="num">${kit ? '—' : totalOf(st,id)}</b><span>Total</span></div></div>
    ${locs.length ? `<div class="card" style="margin-bottom:12px">${locs.map(([l,q]) => `<div class="dl"><span>${esc(l.name)} · ${esc(l.city||'')}</span><span class="num">${q}</span></div>`).join('')}</div>` : ''}
    <div class="card" style="margin-bottom:12px">
      <div class="dl"><span>Prix de vente</span><span class="num">${priceTxt(p)}${p.cur==='FC' ? ' ≈ ' + money(su) : ''}</span></div>
      <div class="dl"><span>Prix d'achat</span><span class="num">${num(p.buy)>0 ? amt(p.buy, p.cur) : (kit && cu ? '≈ ' + money(cu) + ' (produits)' : '<span class="red">à compléter</span>')}</span></div>
      <div class="dl"><span>Commission livreur</span><span class="num">${commVal(p, num(p.comm))}${p.commMode==='pct' ? ' ≈ ' + money(cm) : ''}</span></div>
      ${p.commCity ? Object.entries(p.commCity).map(([c,v]) => `<div class="dl"><span>&nbsp;&nbsp;↳ à ${esc(c)}</span><span class="num">${commVal(p, num(v))}${p.commMode==='pct' ? ' ≈ ' + money(su * num(v) / 100) : ''}</span></div>`).join('') : ''}
      <div class="dl strong"><span>Bénéfice par pièce (après commission)</span><span class="num ${marge<0?'red':'green'}">${money(marge)}</span></div>
      ${p.cat ? `<div class="dl"><span>Catégorie</span><span>${esc(p.cat)}</span></div>` : ''}
      ${p.details ? `<p class="note" style="margin-top:8px;white-space:pre-line">${esc(p.details)}</p>` : ''}
    </div>
    <div class="btns" style="margin-bottom:8px">
      <button class="btn primary" data-a="new:vente" data-pid="${id}">Vendre</button>
      <button class="btn" data-a="new:envoi" data-pid="${id}">Envoyer</button>
      ${kit ? '' : `<button class="btn" data-a="new:entree" data-pid="${id}">Entrée</button><button class="btn" data-a="new:perte" data-pid="${id}">Sortie</button>`}
    </div>
    <button class="btn block" data-a="editprod:${id}">Modifier le produit</button>
    <div class="sec"><h2>Historique</h2></div>
    <div class="list">${hist.length ? hist.map(rowMove).join('') : '<div class="empty">Aucune opération</div>'}</div>`);
}

/* ----- Opérations de stock : entrée, envoi, retour, vente, perte ----- */
function moveForm(type, opt = {}){
  const m = opt.id ? S.moves.find(x => x.id === opt.id) : null;
  if(m) type = m.type;
  if(!S.products.length){ toast("Ajoutez d'abord un produit"); productForm(); return; }
  if((type === 'envoi' || type === 'retour') && !S.livreurs.length){ toast("Ajoutez d'abord un livreur"); livForm(); return; }
  const stEx = stockAt(m ? S.moves.filter(x => x.id !== m.id) : S.moves);
  const pid0 = m?.pid || opt.pid || '';
  const liv0 = m ? (m.liv || m.loc || '') : (opt.liv || '');
  const prods = S.products.filter(p => type === 'entree' || type === 'perte' ? !isKit(p) : true).sort(byName);
  const T = {entree:['Entrée de stock','Ajouter au dépôt'], envoi:['Envoyer du stock à un livreur','Enregistrer l\'envoi'], retour:['Retour de stock au dépôt','Enregistrer le retour'],
             vente:[m ? 'Modifier la vente' : 'Nouvelle vente', m ? 'Enregistrer' : 'Enregistrer la vente'], perte:['Sortie / perte de stock','Enregistrer la sortie']}[type];
  const livOpts = (withDepot, label) => (withDepot ? `<option value="">${label}</option>` : '') + cities().map(c => `<optgroup label="${esc(c)}">${S.livreurs.filter(l => (l.city||'Sans ville') === c).sort(byName).map(l => `<option value="${l.id}" ${l.id===liv0?'selected':''}>${esc(l.name)}</option>`).join('')}</optgroup>`).join('');
  let h = `<form id="mf">`;
  if(type === 'vente' && !m) h += `<details class="card paste" style="margin-bottom:14px" open><summary><b>📋 Coller une commande WhatsApp</b><span class="note"> — remplit le formulaire</span></summary>
      <textarea id="pasteTx" placeholder="Copiez le message du client sur WhatsApp et collez-le ici…"></textarea>
      <div class="btns"><button type="button" class="btn primary sm" id="pasteGo">Remplir automatiquement</button><button type="button" class="btn sm" data-a="tpl">Modèle à envoyer aux clients</button></div>
      <p class="note" id="pasteMsg" style="margin-top:6px"></p></details>`;
  if(type === 'envoi' || type === 'retour') h += field('Livreur *', `<select name="loc" required>${liv0 ? '' : '<option value="">Choisir un livreur…</option>'}${livOpts(false)}</select>`);
  if(type === 'perte') h += field('Où se trouve le produit ?', `<select name="loc">${livOpts(true, 'Au dépôt')}</select>`);
  if(type === 'vente') h += field('Livré par', `<select name="loc">${livOpts(true, 'Vente directe (depuis le dépôt)')}</select>`);
  h += field('Produit *', `<select name="pid" required>${pid0 ? '' : '<option value="">Choisir un produit…</option>'}${prods.map(p => `<option value="${p.id}" ${p.id===pid0?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`);
  h += `<div id="avail"></div><div class="row2">${field('Quantité *', `<input name="qty" type="number" min="1" step="1" required value="${m ? m.qty : 1}">`)}`;
  if(type === 'entree') h += field('Coût unitaire', `<input name="cost" type="number" step="any" min="0" value="${m ? (m.cost ?? '') : ''}">`, '<span id="curl"></span>') + `</div>`;
  else if(type === 'perte') h += field('Motif', `<select name="motif">${MOTIFS.map(x => `<option ${m?.motif===x?'selected':''}>${x}</option>`).join('')}</select>`) + `</div>`;
  else if(type === 'vente') h += field('Prix unitaire', `<input name="price" type="number" step="any" min="0" value="${m ? m.price : ''}">`, '<span id="curl"></span>') + `</div><div class="tot" id="tot"></div>
      ${field('Nom du client', `<input name="client" value="${esc(m?.client)}" placeholder="Ex : Mme Nsimba">`)}
      ${field('Téléphone client (WhatsApp)', `<input name="phone" type="tel" value="${esc(m?.phone)}" placeholder="08… ou +243…">`)}
      ${field('Adresse complète de livraison', `<textarea name="addr" placeholder="Commune, quartier, avenue, n°, point de repère…">${esc(m?.addr)}</textarea>`)}
      <div class="row2">${field('Jour de livraison', `<input name="ddate" type="date" value="${m ? (m.ddate || m.date) : today()}">`)}${field('Heure de livraison', `<input name="dtime" type="time" value="${esc(m?.dtime || '')}">`)}</div>
      ${field('Payé en', `<select name="pay">${PAYS.map(x => `<option value="${x}" ${(m?.pay||'')===x?'selected':''}>${x || '— (non précisé)'}</option>`).join('')}</select>`, 'Pour une vente directe : cash, Mobile Money…')}
      <div class="f"><span>Statut</span><div class="seg" id="segS">${Object.entries(STATUS).map(([k,l]) => `<button type="button" data-s="${k}">${l}</button>`).join('')}</div></div>`;
  else h += `<div></div></div>`;
  h += `<div class="row2">${field(type === 'vente' ? 'Date de la commande' : 'Date', `<input name="date" type="date" required value="${m ? m.date : today()}">`)}${field('Note', `<input name="note" value="${esc(m?.note)}" placeholder="${type==='entree'?'Fournisseur…':'Optionnel'}">`)}</div>
    <button class="btn primary block">${T[1]}</button>
    ${m ? `<button type="button" class="btn ghost-bad block" style="margin-top:8px" data-a="delmove:${m.id}">Supprimer cette opération</button>` : ''}</form>`;
  sheet(T[0], h);

  const f = $('#mf'), E = f.elements;
  if(!m && type === 'vente' && opt.client){ E.client.value = opt.client.name || ''; E.phone.value = opt.client.phone || ''; E.addr.value = opt.client.addr || ''; const d = f.querySelector('details.paste'); if(d) d.open = false; }
  let status = m?.status || (liv0 ? 'attente' : 'livre');
  const paintSeg = () => { if($('#segS')) [...$('#segS').children].forEach(b => b.classList.toggle('on', b.dataset.s === status)); };
  paintSeg();
  if($('#segS')) $('#segS').onclick = e => { const b = e.target.closest('button'); if(b){ status = b.dataset.s; paintSeg(); } };
  const srcLoc = () => type === 'entree' ? null : type === 'envoi' ? '' : (E.loc ? E.loc.value : '');
  const upd = () => {
    const p = prod(E.pid.value), loc = srcLoc();
    $('#avail').innerHTML = p && loc !== null ? `<p class="note" style="margin:-4px 0 10px">Disponible ${locName(loc)} : <b>${avail(stEx, loc, p.id)}</b>${isKit(p) ? ' pack(s)' : ' pièce(s)'}</p>` : '';
    if($('#curl') && p) $('#curl').textContent = p.cur === 'FC' ? 'en ' + LC() : 'en dollars ($)';
    if(type === 'vente' && p){
      const q = num(E.qty.value), pr = num(E.price.value), totU = toUSD(q*pr, p.cur), cost = q * (m && m.pid === p.id ? num(m.costU) : unitCostUSD(p));
      const comm = q * commUFor(p, liv(E.loc.value), toUSD(pr, p.cur));
      $('#tot').innerHTML = `<span>Total client</span><b class="num">${amt(q*pr, p.cur)}</b><small>${p.cur==='FC' ? '≈ ' + money(totU) + ' · ' : ''}Commission livreur : ${money(comm)} · Bénéfice : ${money(totU - cost - comm)}${E.loc.value && feeTxt() ? ' · + frais livraison ' + feeTxt() + ' (pour le livreur)' : ''}</small>`;
    }
  };
  E.pid.onchange = () => { const p = prod(E.pid.value); if(p){ if(E.price) E.price.value = p.sell || ''; if(E.cost) E.cost.value = num(p.buy) || ''; } upd(); };
  if(E.loc) E.loc.onchange = () => { if(type === 'vente' && !m){ status = E.loc.value ? 'attente' : 'livre'; paintSeg(); } upd(); };
  E.qty.oninput = upd; if(E.price) E.price.oninput = upd;
  if(!m && pid0) E.pid.onchange(); else upd();
  if($('#pasteGo')) $('#pasteGo').onclick = () => {
    const txt = $('#pasteTx').value.trim(); if(!txt){ toast('Collez d\'abord le message du client'); return; }
    const o = parseOrder(txt), got = [], miss = [];
    const set = (n, v, lab) => { if(v){ E[n].value = v; got.push(lab); } else miss.push(lab); };
    if(o.pid){ E.pid.value = o.pid; E.pid.onchange(); got.push('produit'); } else miss.push('produit');
    if(o.qty) E.qty.value = o.qty;
    set('client', o.client, 'nom'); set('phone', o.phone, 'téléphone'); set('addr', o.addr, 'adresse');
    if(o.ddate) E.ddate.value = o.ddate;
    set('dtime', o.dtime, 'heure');
    if(o.liv && E.loc){ E.loc.value = o.liv; E.loc.onchange(); got.push('livreur (' + o.city + ')'); }
    if(o.price && E.price){ E.price.value = o.price; got.push('prix'); }
    if(o.when && (!o.dtime || o.slot)) E.note.value = (E.note.value ? E.note.value + ' · ' : '') + 'Livraison : ' + o.when;
    upd();
    $('#pasteMsg').innerHTML = (got.length ? '✅ Rempli : ' + got.join(', ') + '. ' : '') + (miss.length ? '<span class="red">À compléter : ' + miss.join(', ') + '.</span>' : '') + ' Vérifiez avant d\'enregistrer.';
  };

  f.onsubmit = e => {
    e.preventDefault();
    const p = prod(E.pid.value); if(!p){ toast('Choisissez un produit'); return; }
    const qty = Math.round(num(E.qty.value)); if(qty < 1){ toast('Quantité invalide'); return; }
    const rec = Object.assign({}, m || {id:uid(), ts:Date.now(), type});
    rec.pid = p.id; rec.qty = qty; rec.date = E.date.value || today(); rec.note = E.note.value.trim();
    if(type === 'envoi' || type === 'retour'){ rec.liv = E.loc.value; if(!rec.liv){ toast('Choisissez un livreur'); return; } }
    if(type === 'entree'){ rec.cost = num(E.cost.value); }
    if(type === 'perte'){ rec.loc = E.loc.value; rec.motif = E.motif.value; if(!m || m.pid !== p.id) rec.costU = unitCostUSD(p); }
    if(type === 'vente'){
      rec.liv = E.loc.value; rec.price = num(E.price.value); rec.cur = p.cur;
      if(!m || m.pid !== p.id) rec.costU = unitCostUSD(p);
      if(!m || m.pid !== p.id || m.liv !== rec.liv || m.price !== rec.price) rec.commU = commUFor(p, liv(rec.liv), toUSD(rec.price, p.cur, m && m.cur === p.cur ? m.rate : rate()));
      if(!m || m.pid !== p.id || m.cur !== p.cur) rec.rate = rate();
      rec.client = E.client.value.trim(); rec.phone = E.phone.value.trim(); rec.addr = E.addr.value.trim(); rec.status = status;
      rec.ddate = E.ddate.value || rec.date; rec.dtime = E.dtime.value; rec.pay = E.pay ? E.pay.value : (rec.pay || '');
    }
    const next = m ? S.moves.map(x => x.id === m.id ? rec : x) : S.moves.concat([rec]);
    const err = checkStock(next, [p.id].concat(m ? [m.pid] : []));
    if(err){ toast(err); return; }
    S.moves = next;
    if(type === 'entree' && !m && rec.cost > 0) p.buy = rec.cost;
    S.settings.setup = true; save();
    toast(m ? 'Modification enregistrée' : {entree:'Entrée ajoutée au dépôt', envoi:'Stock envoyé au livreur', retour:'Retour enregistré', vente:'Vente enregistrée', perte:'Sortie enregistrée'}[type]);
    if(type === 'vente' && !m){ saleTab = status; render(); saleSheet(rec.id, true); }
    else if((type === 'envoi' || type === 'retour') && opt.liv){ render(); livSheet(opt.liv); }
    else { closeSheet(); render(); }
  };
}

/* ----- Argent : versement, paiement commission, dépense ----- */
function moneyForm(type, opt = {}){
  const m = opt.id ? S.moves.find(x => x.id === opt.id) : null;
  if(m) type = m.type;
  if((type === 'versement' || type === 'paiecomm') && !S.livreurs.length){ toast("Ajoutez d'abord un livreur"); livForm(); return; }
  const liv0 = m?.liv || opt.liv || '';
  const livOpts = cities().map(c => `<optgroup label="${esc(c)}">${S.livreurs.filter(l => (l.city||'Sans ville') === c).sort(byName).map(l => `<option value="${l.id}" ${l.id===liv0?'selected':''}>${esc(l.name)}</option>`).join('')}</optgroup>`).join('');
  const T = {versement:['Versement d\'un livreur','Enregistrer le versement'], paiecomm:['Payer la commission','Enregistrer le paiement'], depense:['Dépense','Enregistrer la dépense']}[type];
  let h = `<form id="nf">`;
  if(type === 'depense') h += field('Catégorie', `<select name="cat">${DEPCATS.map(c => `<option ${(m ? m.cat : opt.cat)===c?'selected':''}>${c}</option>`).join('')}</select>`);
  if(type === 'depense') h += field('Concerne un livreur ? (optionnel)', `<select name="liv"><option value="">Non</option>${livOpts}</select>`);
  else h += field('Livreur *', `<select name="liv" required>${liv0 ? '' : '<option value="">Choisir un livreur…</option>'}${livOpts}</select>`);
  h += `<div id="due"></div><div class="row2">${field('Montant *', `<input name="amount" type="number" step="any" min="0" required value="${m ? m.amount : ''}">`)}
    ${type === 'paiecomm' ? field('Devise', `<select name="cur" disabled><option>$</option></select>`) : field('Devise', `<select name="cur"><option value="$" ${m?.cur!=='FC'?'selected':''}>$</option><option value="FC" ${m?.cur==='FC'?'selected':''}>${esc(LC())}</option></select>`)}</div>
    <div class="row2">${field('Date', `<input name="date" type="date" required value="${m ? m.date : today()}">`)}${field('Note', `<input name="note" value="${esc(m?.note)}" placeholder="${type==='versement'?'Ex : M-Pesa, Airtel Money':'Optionnel'}">`)}</div>
    <button class="btn primary block">${T[1]}</button>
    ${m ? `<button type="button" class="btn ghost-bad block" style="margin-top:8px" data-a="delmove:${m.id}">Supprimer</button>` : ''}</form>`;
  sheet(T[0], h);
  const f = $('#nf'), E = f.elements;
  const upd = () => {
    if(type === 'depense' || !E.liv.value){ $('#due').innerHTML = ''; return; }
    const s = livStats(E.liv.value), dueU = type === 'versement' ? s.toRemit + (m ? moneyUSD(m) : 0) : s.toPay + (m ? num(m.amount) : 0);
    $('#due').innerHTML = `<button type="button" class="tot" style="width:100%;text-align:left" id="fill"><span>${type==='versement'?'Reste à verser':'Commission à payer'}</span><b class="num">${money(dueU)}</b><small>${type==='versement' ? '≈ ' + fcOf(dueU) + ' · ' : 'Cette semaine : ' + money(s.week) + ' · '}touchez pour remplir</small></button>`;
    $('#fill').onclick = () => { if(type === 'versement' && E.cur.value === 'FC') E.amount.value = Math.round(dueU * rate()); else E.amount.value = r2(dueU); };
  };
  E.liv.onchange = upd; upd();
  f.onsubmit = e => {
    e.preventDefault();
    const a = num(E.amount.value); if(!(a > 0)){ toast('Montant invalide'); return; }
    const rec = Object.assign({}, m || {id:uid(), ts:Date.now(), type});
    rec.liv = E.liv.value; rec.amount = a; rec.cur = type === 'paiecomm' ? '$' : E.cur.value; rec.date = E.date.value || today(); rec.note = E.note.value.trim();
    if(!m || m.cur !== rec.cur) rec.rate = rate();
    if(type === 'depense') rec.cat = E.cat.value;
    if(type !== 'depense' && !rec.liv){ toast('Choisissez un livreur'); return; }
    S.moves = m ? S.moves.map(x => x.id === m.id ? rec : x) : S.moves.concat([rec]);
    save(); toast(m ? 'Modification enregistrée' : {versement:'Versement enregistré ✅', paiecomm:'Commission payée ✅', depense:'Dépense enregistrée'}[type]);
    if(opt.liv && !m){ render(); livSheet(opt.liv); } else { closeSheet(); render(); }
  };
}

/* ----- Détail d'une vente ----- */
function saleSheet(id, fresh){
